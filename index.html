<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Stagehand Studio</title>
<style>
:root{
  --bg-app:#101116;
  --panel:#191B22;
  --panel-elevated:#20222C;
  --panel-border:#2B2E3A;
  --stage-bg:#0B0C10;
  --text-primary:#F4F1EA;
  --text-secondary:#9A9CAA;
  --text-muted:#6B6E7C;
  --accent-violet:#7C6FFF;
  --accent-teal:#2E9C8F;
  --accent-pink:#E8637C;
  --accent-amber:#C08A2E;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;height:100vh;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-body);display:flex;flex-direction:column;overflow:hidden;}

.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--panel-border);background:var(--panel);}
.logo{font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.logo .dot{width:8px;height:8px;border-radius:50%;background:var(--accent-violet);}
.topbar-actions{display:flex;gap:10px;}
.btn{border:none;border-radius:var(--radius-sm);padding:8px 16px;font-size:13px;font-family:var(--font-body);cursor:pointer;}
.btn-primary{background:var(--accent-violet);color:#fff;}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--panel-border);}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--text-secondary);}

.main{flex:1;display:flex;min-height:0;}

.icon-rail{width:64px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--panel-border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px;}
.rail-btn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--text-secondary);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rail-btn:hover{background:var(--panel-elevated);color:var(--text-primary);}
.rail-btn.active{background:var(--panel-elevated);color:var(--accent-violet);box-shadow:inset 0 0 0 1.5px var(--accent-violet);}

.sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--panel-border);display:flex;flex-direction:column;min-height:0;}
.panel-content{flex:1;overflow-y:auto;padding:16px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:4px 0 10px;}
.anim-hint{font-size:12px;color:var(--text-muted);line-height:1.55;}

.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.char-card{background:var(--panel-elevated);border:1.5px solid transparent;border-radius:var(--radius-md);padding:8px;cursor:pointer;text-align:center;}
.char-card:hover{border-color:var(--accent-violet);}
.char-card svg{width:100%;height:auto;display:block;}
.char-name{font-size:12px;font-weight:600;margin-top:4px;}
.char-tag{font-size:10px;color:var(--text-muted);}

.pose-row,.reaction-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.pose-btn,.reaction-btn{background:var(--panel-elevated);border:1.5px solid transparent;color:var(--text-secondary);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:var(--font-body);}
.pose-btn.active,.reaction-btn.active{border-color:var(--accent-violet);color:var(--text-primary);}

.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.scene-card{background:var(--panel-elevated);border:1.5px solid transparent;border-radius:var(--radius-md);overflow:hidden;cursor:pointer;}
.scene-card.selected{border-color:var(--accent-violet);}
.scene-thumb{width:100%;height:66px;overflow:hidden;background:#000;}
.scene-thumb svg{width:100%;height:100%;display:block;}
.scene-name{font-size:11.5px;font-weight:600;padding:6px 8px 8px;}

.bg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bg-card{border-radius:var(--radius-md);overflow:hidden;cursor:pointer;border:1.5px solid transparent;}
.bg-card.selected{border-color:var(--accent-violet);}
.bg-swatch{height:46px;}
.bg-name{font-size:11px;padding:6px 8px;background:var(--panel-elevated);}

.upload-btn{width:100%;background:var(--panel-elevated);border:1.5px dashed var(--panel-border);color:var(--text-secondary);border-radius:var(--radius-md);padding:10px;font-size:12px;cursor:pointer;margin-bottom:10px;font-family:var(--font-body);text-align:left;}
.upload-btn:hover{color:var(--text-primary);border-color:var(--accent-violet);}

.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chip{background:var(--panel-elevated);border:1px solid var(--panel-border);color:var(--text-secondary);border-radius:999px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:var(--font-body);}
.chip.active{background:var(--accent-violet);border-color:var(--accent-violet);color:#fff;}

.obj-lib-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.obj-lib-card{background:var(--panel-elevated);border-radius:var(--radius-md);padding:8px 4px;text-align:center;cursor:pointer;}
.obj-lib-card:hover{outline:1.5px solid var(--accent-violet);}
.obj-lib-card svg{width:36px;height:36px;}
.obj-lib-name{font-size:9.5px;color:var(--text-secondary);margin-top:4px;line-height:1.2;}

.stage-wrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
.stage-area{flex:1;position:relative;background:var(--stage-bg);overflow:hidden;min-height:0;}
#stageScaler{position:absolute;left:50%;top:50%;width:960px;height:540px;margin:-270px 0 0 -480px;transform:scale(var(--k,1));transform-origin:center center;}
.stage{position:relative;width:960px;height:540px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#222;}
#stageBackground{position:absolute;inset:0;}
#stageBackground svg{width:100%;height:100%;display:block;}
#stageObjects{position:absolute;inset:0;pointer-events:none;}
#stageCharacters{position:absolute;inset:0;pointer-events:none;}

.stage-object,.stage-character{position:absolute;cursor:move;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;}
.stage-object.selected,.stage-character.selected{outline:2px solid var(--accent-violet);outline-offset:3px;}
.stage-object-inner,.stage-character-inner{width:100%;height:100%;}
.stage-object-inner svg,.stage-object-inner img,.stage-character-inner svg{width:100%;height:100%;display:block;pointer-events:none;}
.obj-text{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;outline:none;word-break:break-word;line-height:1.15;text-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:auto;}
.obj-handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--accent-violet);border-radius:3px;cursor:nwse-resize;display:none;touch-action:none;}
.stage-object.selected .obj-handle,.stage-character.selected .obj-handle{display:block;}
.obj-toolbar{position:absolute;top:-38px;left:50%;transform:translateX(-50%);display:none;gap:3px;background:var(--panel-elevated);border:1px solid var(--panel-border);border-radius:8px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.4);white-space:nowrap;z-index:50;}
.stage-object.selected .obj-toolbar,.stage-character.selected .obj-toolbar{display:flex;}
.obj-tool-btn{width:26px;height:26px;border:none;border-radius:6px;background:transparent;color:var(--text-secondary);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.obj-tool-btn:hover{background:var(--panel-border);color:var(--text-primary);}
.obj-tool-btn.danger:hover{background:var(--accent-pink);color:#fff;}

/* ===== Figuren-Rig: Mundformen (Visemen), Posen, Stimmungen ===== */
.fig-root{overflow:visible;}
.fig-root .vm{display:none;}
.fig-root .vm-rest{display:inline;}
.stage-character[data-v] .vm-rest{display:none;}
.stage-character[data-v="rest"] .vm-rest,.stage-character[data-v="joy"] .vm-joy,.stage-character[data-v="anger"] .vm-anger,
.stage-character[data-v="surprise"] .vm-surprise,.stage-character[data-v="mm"] .vm-mm,.stage-character[data-v="a"] .vm-a,
.stage-character[data-v="e"] .vm-e,.stage-character[data-v="i"] .vm-i,.stage-character[data-v="o"] .vm-o,
.stage-character[data-v="u"] .vm-u,.stage-character[data-v="fv"] .vm-fv{display:inline;}

/* Ruhezustand: atmen + blinzeln (nutzt transform; Stimmungen nutzen die separaten Eigenschaften rotate/translate/scale) */
.stage-character .torso{animation:breathe 3.4s ease-in-out infinite;}
.stage-character .head-group{animation:headBreath 3.4s ease-in-out infinite;transition:rotate .25s ease,translate .25s ease,scale .25s ease;}
.stage-character .eye-g{animation:blink 5s infinite;animation-delay:var(--blink,0s);}
.stage-character .brow-left,.stage-character .brow-right{transform-box:fill-box;transform-origin:50% 100%;transition:translate .25s ease,rotate .25s ease;}
.stage-character .arm-main,.stage-character .arm-off{transition:transform .35s cubic-bezier(.3,1.35,.5,1);}
@keyframes breathe{0%,100%{transform:scaleY(1);}50%{transform:scaleY(1.011);}}
@keyframes headBreath{0%,100%{transform:translateY(0);}50%{transform:translateY(-1px);}}
@keyframes blink{0%,91%,100%{transform:scaleY(1);}94%{transform:scaleY(.08);}}

/* Sprechen: leichtes Nicken, Gestik nur in der Grundpose */
.stage-character.talking .head-group{animation:talkNod .62s ease-in-out infinite alternate;}
@keyframes talkNod{from{transform:rotate(-.9deg) translateY(0);}to{transform:rotate(1deg) translateY(-1.2px);}}
.stage-character.talking.gest.pose-idle .arm-main{animation:gestA 2.7s ease-in-out infinite;}
.stage-character.talking.gest.pose-idle .arm-off{animation:gestB 2.7s ease-in-out infinite;animation-delay:-1.1s;}
.stage-character.talking.gest.pose-idle .view-side .arm-off{animation:none;}
.stage-character.talking.gest.pose-idle .view-back .arm-off,.stage-character.talking.gest.pose-idle .view-back .arm-main{animation:none;}
@keyframes gestA{0%,100%{transform:rotate(-8deg);}30%{transform:rotate(-38deg);}65%{transform:rotate(-22deg);}}
@keyframes gestB{0%,100%{transform:rotate(6deg);}40%{transform:rotate(26deg);}75%{transform:rotate(12deg);}}

/* Pose: Gehen (Seite/¾ = Beinschwung, Front/Rücken = Marschieren auf der Stelle) */
.pose-walk .leg-main{animation:legA .9s ease-in-out infinite;}
.pose-walk .leg-off{animation:legB .9s ease-in-out infinite;}
.pose-walk .arm-main{animation:armB .9s ease-in-out infinite;}
.pose-walk .arm-off{animation:armA .9s ease-in-out infinite;}
.pose-walk .torso,.pose-walk .head-group,.pose-walk.talking .head-group{animation:walkBob .45s ease-in-out infinite;}
@keyframes legA{0%,100%{transform:rotate(22deg);}50%{transform:rotate(-22deg);}}
@keyframes legB{0%,100%{transform:rotate(-22deg);}50%{transform:rotate(22deg);}}
@keyframes armA{0%,100%{transform:rotate(18deg);}50%{transform:rotate(-18deg);}}
@keyframes armB{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(18deg);}}
@keyframes walkBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.5px);}}
.pose-walk .view-threeq .leg-main{animation-name:legA3;}
.pose-walk .view-threeq .leg-off{animation-name:legB3;}
@keyframes legA3{0%,100%{transform:rotate(13deg);}50%{transform:rotate(-13deg);}}
@keyframes legB3{0%,100%{transform:rotate(-13deg);}50%{transform:rotate(13deg);}}
.pose-walk .view-front .leg-main,.pose-walk .view-back .leg-main{animation:stepF .9s ease-in-out infinite;}
.pose-walk .view-front .leg-off,.pose-walk .view-back .leg-off{animation:stepF .9s ease-in-out infinite;animation-delay:-.45s;}
@keyframes stepF{0%,50%,100%{transform:translateY(0);}25%{transform:translateY(-7px);}}
.pose-walk .view-front .arm-main,.pose-walk .view-back .arm-main{animation:armFB .9s ease-in-out infinite;}
.pose-walk .view-front .arm-off,.pose-walk .view-back .arm-off{animation:armFB2 .9s ease-in-out infinite;}
@keyframes armFB{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(-14deg);}}
@keyframes armFB2{0%,100%{transform:rotate(3deg);}50%{transform:rotate(14deg);}}

/* Pose: Zeigen / Winken / Erklären / Jubeln */
.pose-point .arm-main{transform:rotate(-80deg);}
.pose-point .view-side .arm-main{transform:rotate(-88deg);}
.pose-wave .arm-main{animation:waveA .6s ease-in-out infinite;}
@keyframes waveA{0%,100%{transform:rotate(-142deg);}50%{transform:rotate(-168deg);}}
.pose-explain .arm-main{animation:expA 2.2s ease-in-out infinite;}
.pose-explain .arm-off{animation:expB 2.2s ease-in-out infinite;animation-delay:-.9s;}
.pose-explain .view-side .arm-off{animation:expA 2.2s ease-in-out infinite;animation-delay:-.9s;}
@keyframes expA{0%,100%{transform:rotate(-24deg);}35%{transform:rotate(-52deg);}70%{transform:rotate(-32deg);}}
@keyframes expB{0%,100%{transform:rotate(16deg);}40%{transform:rotate(34deg);}75%{transform:rotate(20deg);}}
.pose-cheer .arm-main{animation:cheerA .5s ease-in-out infinite;}
.pose-cheer .arm-off{animation:cheerB .5s ease-in-out infinite;}
.pose-cheer .view-side .arm-off{animation:cheerA .5s ease-in-out infinite;animation-delay:-.25s;}
.pose-cheer .torso,.pose-cheer .head-group{animation:cheerBob .5s ease-in-out infinite;}
@keyframes cheerA{0%,100%{transform:rotate(-150deg);}50%{transform:rotate(-168deg);}}
@keyframes cheerB{0%,100%{transform:rotate(150deg);}50%{transform:rotate(168deg);}}
@keyframes cheerBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}


.pose-wave .view-side .arm-main{animation-name:waveS;}
@keyframes waveS{0%,100%{transform:rotate(-118deg);}50%{transform:rotate(-140deg);}}
.pose-cheer .view-side .arm-main,.pose-cheer .view-side .arm-off{animation-name:cheerS;}
@keyframes cheerS{0%,100%{transform:rotate(-126deg);}50%{transform:rotate(-142deg);}}
/* Reaktionen (Kopf/Brauen); Mundform kommt über data-v */
.mood-joy .head-group{translate:0 -3px;}
.mood-joy .brow-left,.mood-joy .brow-right{translate:0 -2px;}
.mood-anger .head-group{rotate:-2.5deg;}
.mood-anger .brow-left{translate:0 2.5px;rotate:9deg;}
.mood-anger .brow-right{translate:0 2.5px;rotate:-9deg;}
.mood-surprise .head-group{translate:0 -4px;scale:1.03;}
.mood-surprise .brow-left,.mood-surprise .brow-right{translate:0 -5px;}
.mood-news .head-group{rotate:3deg;translate:0 -2px;}
.mood-news .brow-left,.mood-news .brow-right{translate:0 -3px;}
.mood-listening .head-group{rotate:-5deg;}
.mood-listening .brow-left,.mood-listening .brow-right{translate:0 -2px;}
.reaction-pulse{animation:reactionPop .5s ease-out;}
@keyframes reactionPop{0%{transform:scale(1);}35%{transform:scale(1.06);}100%{transform:scale(1);}}

/* object entrance effects, triggered at their scheduled timeline moment during playback */
.stage-object.obj-effect-fade-in{animation:objFadeIn .5s ease;}
@keyframes objFadeIn{0%{opacity:0;}100%{opacity:1;}}
.stage-object.obj-effect-rise-up{animation:objRiseUp .5s ease;}
@keyframes objRiseUp{0%{opacity:0;transform:translateY(30px);}100%{opacity:1;transform:translateY(0);}}
.stage-object.obj-effect-slide-in-left{animation:objSlideLeft .5s ease;}
@keyframes objSlideLeft{0%{opacity:0;transform:translateX(-40px);}100%{opacity:1;transform:translateX(0);}}
.stage-object.obj-effect-zoom-in{animation:objZoomIn .5s ease;}
@keyframes objZoomIn{0%{opacity:0;transform:scale(0.4);}100%{opacity:1;transform:scale(1);}}
.stage-object.obj-effect-pop{animation:objPop .45s cubic-bezier(.34,1.56,.64,1);}
@keyframes objPop{0%{opacity:0;transform:scale(0.3);}70%{transform:scale(1.12);}100%{opacity:1;transform:scale(1);}}

/* Sprechblasen */
#stageBubbles{position:absolute;inset:0;pointer-events:none;z-index:30;}
.bubble{position:absolute;max-width:46%;background:#fff;color:#1a1b22;border-radius:14px;padding:8px 12px;font-family:var(--font-body);font-weight:600;font-size:var(--bfs,17px);line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .18s,transform .18s;}
.bubble.on{opacity:1;transform:none;}
.bubble::after{content:'';position:absolute;bottom:-7px;left:var(--tail,50%);width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px;}
.bubble .w{opacity:.42;transition:opacity .12s;}
.bubble .w.done{opacity:1;}
.bubble .w.cur{opacity:1;background:#ffe27a;border-radius:4px;}
body.playing .stage-character,body.playing .stage-object{pointer-events:none;cursor:default;}
body.playing .stage-character.selected,body.playing .stage-object.selected{outline:none;}

/* Timeline-Ergänzungen */
.timeline-row-label{display:flex;align-items:center;gap:4px;}
.timeline-row-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.timeline-add{flex-shrink:0;border:none;background:var(--panel-elevated);color:var(--text-secondary);border-radius:5px;width:22px;height:20px;font-size:12px;line-height:1;cursor:pointer;padding:0;}
.timeline-add:hover{background:var(--accent-violet);color:#fff;}
.timeline-bar{touch-action:none;}
.timeline-bar.ghost{background:transparent !important;color:var(--text-muted);font-weight:400;cursor:default;pointer-events:none;}
.timeline-bar.warn{outline:2px solid var(--accent-pink);outline-offset:-2px;}
.timeline-bar.dragging{z-index:5;box-shadow:0 0 0 2px #fff;}
.timeline-bar.dragging::after{content:attr(data-tip);position:absolute;top:-22px;left:0;background:#000;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;pointer-events:none;}
.timeline-bar-handle{touch-action:none;}
.tl-cursor{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--accent-violet);box-shadow:0 0 6px var(--accent-violet);display:none;pointer-events:none;z-index:6;}
.timeline-ruler-track{position:relative;}
#timelineHint{padding:2px 22px 4px;font-size:11px;color:var(--accent-amber);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#timelineHint:empty{display:none;}
.anim-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);margin:0 0 10px;cursor:pointer;}
.anim-check input{accent-color:var(--accent-violet);}

/* Sprecherspur: zweizeilig */
.speaker-track{flex-wrap:wrap;}
input.speaker-line{flex:1 1 180px;}
.speaker-opts{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:2px 0 0 41px;}
.speaker-opt{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-muted);}
.speaker-opt-lbl{white-space:nowrap;}
.speaker-opt input[type=number]{width:54px;background:var(--panel);border:1px solid var(--panel-border);color:var(--text-primary);border-radius:6px;padding:5px;font-size:11px;}
.speaker-opt input[type=range]{width:84px;accent-color:var(--accent-violet);}
.speaker-opt input[type=checkbox]{accent-color:var(--accent-violet);width:16px;height:16px;}
.speaker-val{min-width:34px;color:var(--text-secondary);}
select.speaker-voice{max-width:190px;}
.speaker-play,.speaker-track .ctrl-btn{flex-shrink:0;}
@media (max-width:820px){
  .speaker-opts{padding-left:0;}
  select.speaker-voice{max-width:150px;}
  .bubble{max-width:62%;}
}


/* ===== bottom timeline: scene/transition track, music track, speaker tracks ===== */
.timeline-panel{flex-shrink:0;background:var(--panel);border-top:1px solid var(--panel-border);display:flex;flex-direction:column;max-height:44vh;overflow-y:auto;}
.track-row{display:flex;align-items:center;gap:14px;padding:9px 22px;border-bottom:1px solid var(--panel-border);}
.track-label{font-size:10.5px;color:var(--text-secondary);flex-shrink:0;width:140px;text-transform:uppercase;letter-spacing:.04em;}
.track-scroll{display:flex;gap:6px;overflow-x:auto;align-items:center;flex:1;}

.filmstrip-card{flex-shrink:0;width:104px;cursor:pointer;border:1.5px solid transparent;border-radius:var(--radius-md);overflow:hidden;background:var(--panel-elevated);}
.filmstrip-card.active{border-color:var(--accent-violet);}
.filmstrip-thumb{width:100%;height:56px;overflow:hidden;position:relative;background:#333;}
.filmstrip-thumb svg{width:100%;height:100%;display:block;}
.filmstrip-label{font-size:9.5px;padding:4px 6px;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center;gap:4px;}
.filmstrip-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.filmstrip-del{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;padding:0;flex-shrink:0;}
.filmstrip-del:hover{color:var(--accent-pink);}
.filmstrip-add{flex-shrink:0;width:60px;height:76px;border:1.5px dashed var(--panel-border);border-radius:var(--radius-md);background:none;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;font-family:var(--font-body);}
.filmstrip-add:hover{border-color:var(--accent-violet);color:var(--accent-violet);}

.transition-connector{display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.transition-select{background:var(--panel-elevated);border:1px solid var(--panel-border);color:var(--text-secondary);border-radius:6px;font-size:9px;padding:4px 2px;max-width:58px;cursor:pointer;}

.master-row{align-items:flex-start;}

.stage.transition-fade{animation:transFade .5s ease;}
@keyframes transFade{0%{opacity:0;}100%{opacity:1;}}
.stage.transition-slide-left{animation:transSlideLeft .5s ease;}
@keyframes transSlideLeft{0%{transform:translateX(6%);opacity:0;}100%{transform:translateX(0);opacity:1;}}
.stage.transition-slide-up{animation:transSlideUp .5s ease;}
@keyframes transSlideUp{0%{transform:translateY(6%);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.stage.transition-zoom{animation:transZoom .5s ease;}
@keyframes transZoom{0%{transform:scale(1.08);opacity:0;}100%{transform:scale(1);opacity:1;}}
.stage.transition-wipe{animation:transWipe .5s ease;}

.obj-timeline-headrow{display:flex;align-items:center;gap:14px;padding:10px 22px 2px;}

.timeline-ruler-spacer{width:140px;flex-shrink:0;}
.timeline-ruler-track{flex:1;position:relative;height:14px;}
.timeline-tick{position:absolute;top:0;font-size:9px;color:var(--text-muted);transform:translateX(-50%);white-space:nowrap;}

.timeline-grid-row{display:flex;align-items:center;gap:0;padding:3px 22px;}
.timeline-row-label{width:140px;flex-shrink:0;font-size:10.5px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px;}
.timeline-row-track{flex:1;position:relative;height:24px;background:var(--panel-elevated);border-radius:6px;}
.timeline-bar{position:absolute;top:2px;bottom:2px;border-radius:5px;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:10.5px;color:#14151a;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
.timeline-bar span{overflow:hidden;text-overflow:ellipsis;}
.timeline-bar select{background:transparent;border:none;color:inherit;font-size:10px;font-weight:600;cursor:pointer;margin-left:auto;max-width:100%;}
.timeline-bar.draggable-bar{cursor:grab;}
.timeline-bar.draggable-bar:active{cursor:grabbing;}
.timeline-bar-handle{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,0.28);touch-action:none;}

.speaker-panel{padding:10px 22px 14px;}
.track-label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}

<script>
/* ================= Sprache (DE/EN): Oberfläche ================= */
let LANG=(function(){ try{ const v=localStorage.getItem('sh-lang'); if(v==='de'||v==='en') return v; }catch(_){} return /^de/i.test(navigator.language||'')?'de':'en'; })();
const $t=(de,en)=>LANG==='en'?en:de;                 // Satz je nach Oberflächensprache
const EN_DICT={
  'Keine':'None','Sanft':'Soft','Energetisch':'Energetic','Corporate':'Corporate','Spannungsvoll':'Tense',
  '✂ Schnitt':'✂ Cut','◐ Überblenden':'◐ Fade','→ Schieben':'→ Slide','↑ Hoch':'↑ Up','▥ Wischblende':'▥ Wipe','⤢ Zoom':'⤢ Zoom',
  'Neutral':'Neutral','Freude':'Joy','Ärger':'Anger','Verwunderung':'Surprise','Neuigkeiten':'News','Interessiertes Zuhören':'Listening',
  'Stehen':'Standing','Gehen':'Walking','Zeigen':'Pointing','Winken':'Waving','Erklären':'Explaining','Jubeln':'Cheering',
  'Front':'Front','Seite':'Side','Rücken':'Back',
  'Kein Effekt':'No effect','Einblenden':'Fade in','Von unten einfliegen':'Rise from below','Von links einfliegen':'Slide in from left','Sanft vergrößern':'Gentle zoom','Reinpoppen':'Pop in',
  'Studio Dunkel':'Studio dark','Studio Hell':'Studio light','Violett':'Violet','Warm':'Warm',
  'Versicherungsbüro':'Insurance office','Arztpraxis':'Doctor\u2019s office','Einzelhandelsgeschäft':'Retail store','Autowerkstatt':'Car workshop','Messehalle':'Exhibition hall','Messe-Freigelände':'Fairgrounds',
  'Stuhl':'Chair','Tisch':'Table','Tafel':'Blackboard','Schreibtisch':'Desk','Computer':'Computer','Pflanze':'Plant','Tür':'Door','Fenster':'Window','Uhr':'Clock','Lampe':'Lamp',
  'Schalter/Tresen':'Counter','Tresor':'Safe','Aktenschrank':'Filing cabinet','Behandlungsliege':'Exam table','Klemmbrett':'Clipboard','Regal':'Shelf','Kasse':'Cash register','Einkaufswagen':'Shopping cart',
  'Alle':'All','Allgemein':'General','Versicherung':'Insurance','Einzelhandel':'Retail',
  'Beraterin':'Advisor','Bankberater':'Bank advisor','Ärztin':'Doctor','Kunde':'Customer','Rentner':'Retiree','Studentin':'Student','Mechaniker':'Mechanic','Verkäuferin':'Sales assistant','Verkäufer':'Sales assistant',
  'Azubi':'Apprentice','Messehost':'Trade fair host','Empfang':'Reception','Seniorin':'Senior','Designerin':'Designer','Handwerker':'Tradesman','Bankangestellte':'Bank clerk',
  'Herr Klein':'Mr. Klein','Bild':'Image','Objekt':'Object','Hintergrund':'Background','Musik':'Music'
};
function $d(x){                                       // Daten-Beschriftung übersetzen (Stammdaten bleiben deutsch)
  if(LANG!=='en'||x==null) return x;
  if(EN_DICT[x]!==undefined) return EN_DICT[x];
  let m=/^(.*) · (\d+)$/.exec(x); if(m&&EN_DICT[m[1]]) return EN_DICT[m[1]]+' · '+m[2];
  m=/^Szene (\d+)$/.exec(x); if(m) return 'Scene '+m[1];
  return x;
}
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-en]').forEach(el=>{ if(el.dataset.de===undefined) el.dataset.de=el.textContent; el.textContent=LANG==='en'?el.dataset.en:el.dataset.de; });
  document.querySelectorAll('[data-en-title]').forEach(el=>{ if(el.dataset.deTitle===undefined) el.dataset.deTitle=el.getAttribute('title')||''; el.setAttribute('title',LANG==='en'?el.dataset.enTitle:el.dataset.deTitle); });
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
}
/* ================= Figuren-Engine (4 Ansichten, 20 Figuren) ================= */
/* ====================================================================
   FIGUREN-ENGINE v2  –  Comic-Flat mit realistischeren Proportionen
   Ansichten: front | threeq (3/4, blickt nach rechts) | side (Profil, blickt nach rechts) | back
   Einheitliche Animations-Anker in ALLEN Ansichten:
     .fig-root  .torso  .head-group  .arm-main  .arm-off  .leg-main  .leg-off
     .brow-left .brow-right  .eye-g  .vm (Viseme)  .mouth
   ==================================================================== */
function shade(hex, f){
  const c=hex.replace('#','');
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const cl=v=>Math.min(255,Math.max(0,Math.round(v)));
  return '#'+[cl(r*f),cl(g*f),cl(b*f)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function mixHex(a,b,t){
  const pa=a.replace('#',''), pb=b.replace('#','');
  const ch=i=>Math.round(parseInt(pa.substr(i,2),16)*(1-t)+parseInt(pb.substr(i,2),16)*t);
  return '#'+[0,2,4].map(i=>ch(i).toString(16).padStart(2,'0')).join('');
}

function headPathFront(jaw){

    ? 'M72 48 C71 28 85 14 100 14 C115 14 129 28 128 48 C128 62 124 74 117 80 Q108 84 100 84 Q92 84 83 80 C76 74 72 62 72 48 Z'
    : 'M73 48 C72 28 85 14 100 14 C115 14 128 28 127 48 C127 64 119 80 100 84 C81 80 73 64 73 48 Z';
}
function headPathSide(jaw){
  const chin = jaw==='strong' ? 'L126 77 Q124 84 114 84' : 'L124 79 Q121 85 112 84';
  return 'M72 50 C70 28 86 13 102 13 C118 13 127 25 127 40 L129 46 Q131 50 129 52 L135 59 Q136 62 132 63 L128 64 L128 68 Q129 70.5 127 71.5 Q128.5 74 126 75 '+chin+' L98 81 C82 79 72 66 72 50 Z';
}

/* ---------- Haare: {behind, front} je Ansicht ---------- */
function hairFront(style,c,v){
  const d=shade(c,0.78), l=shade(c,1.28);
  const hl=(p)=>`<path d="${p}" stroke="${l}" stroke-width="2.2" fill="none" opacity=".35" stroke-linecap="round"/>`;
  const R={behind:'',front:''};
  switch(style){
    case 'bald': R.front=`<ellipse cx="90" cy="30" rx="9" ry="4.5" fill="#fff" opacity=".14"/>`; break;
    case 'balding':
      R.front=`<path d="M72 52 C70 44 71 37 75 32 L80 38 C78 44 78 50 79 58Z" fill="${c}"/><path d="M128 52 C130 44 129 37 125 32 L120 38 C122 44 122 50 121 58Z" fill="${c}"/><ellipse cx="90" cy="27" rx="9" ry="4.5" fill="#fff" opacity=".12"/>`; break;
    case 'buzz':
      R.front=`<path d="M72 48 C70 27 85 13 100 13 C115 13 130 27 128 48 C125 38 121 33 100 31 C79 33 75 38 72 48Z" fill="${c}" opacity=".92"/>`; break;
    case 'short':
      R.front=`<path d="M70 52 C65 24 84 9 103 10 C121 11 133 26 130 52 C128 43 124 36 118 32 C107 37 91 35 83 28 C79 35 74 43 70 52Z" fill="${c}"/>`+hl('M86 17 Q93 14 100 17')+`<path d="M90 29 Q100 33 112 31" stroke="${d}" stroke-width="1.5" fill="none" opacity=".5"/>`; break;
    case 'quiff':
      R.front=`<path d="M70 52 C62 22 86 4 112 8 C132 11 134 30 130 52 C128 42 124 35 116 31 C104 36 88 33 79 25 C76 34 73 43 70 52Z" fill="${c}"/>`+hl('M88 14 Q102 8 118 14'); break;
    case 'messy':
      R.front=`<path d="M70 52 C64 34 70 20 80 14 L82 6 L90 12 L98 4 L105 11 L114 5 L118 14 L127 12 L126 24 C132 32 131 42 130 52 C128 42 124 36 118 33 C106 37 92 35 83 30 C79 36 74 44 70 52Z" fill="${c}"/>`; break;
    case 'bob':
      R.behind=`<path d="M68 46 C63 72 66 88 73 96 L127 96 C134 88 137 72 132 46 Z" fill="${c}"/>`;

function headFB(ch, uid, view, mode){

function characterSVG(ch, uid, facing, opts){
  facing=facing||'front'; opts=opts||{};
  const vb = opts.avatar ? (facing==='side'?'52 2 100 100':'50 2 100 100') : '0 0 200 340';

}

/* ================= State ================= */
let sceneCounter=1, charInstCounter=1, objCounter=1;
function makeScene(overrides){
  return Object.assign({
    id:'scene'+(sceneCounter++), label:'Szene '+sceneCounter,
    bgType:'plain', bgId:'studio-light',
    transitionOut:'fade', bgMusic:'none', duration:8,
    characters:[], objects:[]
  }, overrides||{});
}
let scenesTimeline=[ makeScene({label:'Szene 1'}) ];
let currentSceneIndex=0;
function getCurrentScene(){ return scenesTimeline[currentSceneIndex]; }

let currentTab='scenes';
let currentObjFilter='alle';
let selectedEntity=null; // {kind:'obj'|'char', id}

const panelContent=document.getElementById('panelContent');

function selectEntity(kind, id){
  selectedEntity = (kind && id) ? {kind,id} : null;
  renderObjects();
  renderCharacters();
  if(currentTab==='animation') renderPanel();
}

/* ================= Sidebar panel rendering ================= */
function renderCharTab(container){
  const t=document.createElement('div'); t.className='section-title'; t.textContent=$t('Figur auf die Bühne setzen','Place a figure on the stage');
  container.appendChild(t);
  const grid=document.createElement('div'); grid.className='char-grid';
  characters.forEach(ch=>{
    const card=document.createElement('div'); card.className='char-card';
    card.innerHTML = characterSVG(ch, 'lib-'+ch.id) + `<div class="char-name">${$d(ch.name)}</div><div class="char-tag">${$d(ch.tag)}</div>`;
    card.addEventListener('click', ()=>addCharacterToStage(ch.id));
    grid.appendChild(card);
  });
  container.appendChild(grid);
  const hint=document.createElement('div'); hint.className='anim-hint'; hint.style.marginTop='10px';
  hint.textContent=$t('Mehrere Figuren pro Szene möglich. Pose und Reaktion stellst du im Tab „Animation" ein — je Figur eine eigene Sprecherspur unten in der Timeline.','Several figures per scene are possible. Set pose and reaction in the “Animation” tab — each figure gets its own speaker track in the timeline below.');
  container.appendChild(hint);
}

function renderAnimationTab(container){
  const t=document.createElement('div'); t.className='section-title'; t.textContent=$t('Animation & Reaktion','Animation & reaction');
  container.appendChild(t);
  if(!selectedEntity || selectedEntity.kind!=='char'){
    const hint=document.createElement('div'); hint.className='anim-hint';
    hint.textContent=$t('Wähle zuerst eine platzierte Figur auf der Bühne aus, um Blickrichtung, Pose und Reaktion einzustellen.','First select a figure on the stage to set its facing, pose and reaction.');
    container.appendChild(hint);
    return;
  }
  const inst=getCurrentScene().characters.find(c=>c.id===selectedEntity.id);
  if(!inst) return;
  const def=characters.find(c=>c.id===inst.charId)||{name:''};
  const who=document.createElement('div'); who.className='anim-hint'; who.style.marginBottom='12px'; who.innerHTML=$t('Ausgewählt','Selected')+': <b>'+$d(def.name)+'</b>';
  container.appendChild(who);
  const section=(txt)=>{ const s=document.createElement('div'); s.className='section-title'; s.textContent=txt; container.appendChild(s); };
  const btnRow=(opts,cur,onPick,cls)=>{
    const row=document.createElement('div'); row.className=cls||'pose-row';
    opts.forEach(([val,label])=>{
      const b=document.createElement('button'); b.className='pose-btn'+(cur===val?' active':''); b.textContent=label; b.dataset.val=val;
      b.addEventListener('click',()=>onPick(val)); row.appendChild(b);
    });
    container.appendChild(row); return row;
  };
  const check=(label,val,onChange)=>{
    const l=document.createElement('label'); l.className='anim-check';
    const c=document.createElement('input'); c.type='checkbox'; c.checked=!!val; c.addEventListener('change',()=>onChange(c.checked));
    l.appendChild(c); l.appendChild(document.createTextNode(' '+label)); container.appendChild(l);
  };

  section($t('Blickrichtung','Facing'));
  const fr=btnRow(trOpts(facingOptions), inst.facing||'front', (val)=>{ inst.facing=val; renderCharacters(); renderPanel(); });
  const flipBtn=document.createElement('button'); flipBtn.className='pose-btn'+(inst.flipped?' active':''); flipBtn.textContent=$t('⇋ Spiegeln','⇋ Mirror'); flipBtn.dataset.val='flip';
  flipBtn.addEventListener('click',()=>{ toggleCharFlip(inst.id); renderPanel(); }); fr.appendChild(flipBtn);
  if(getCurrentScene().characters.length>1){
    const dlg=document.createElement('button'); dlg.className='pose-btn'; dlg.textContent=$t('💬 Dialog: einander zuwenden','💬 Dialogue: face each other'); dlg.dataset.val='dialog';
    dlg.addEventListener('click',()=>faceEachOther(inst.id)); fr.appendChild(dlg);
  }
  const fh=document.createElement('div'); fh.className='anim-hint'; fh.style.marginBottom='16px';
  fh.textContent=$t('Seite und ¾ blicken standardmäßig nach rechts; „Spiegeln“ dreht sie nach links. Für Dialoge: beide Figuren auf ¾ oder Seite, eine gespiegelt.','Side and ¾ views face right by default; “Mirror” turns them to the left. For dialogues: put both figures on ¾ or side, one of them mirrored.');
  container.appendChild(fh);

  section($t('Grundpose (Ruhezustand)','Base pose (resting state)'));
  btnRow(trOpts(poseOptions), inst.action||'idle', (val)=>{ inst.action=val; renderCharacters(); renderPanel(); renderObjectTimeline(); });
  check($t('Beim Gehen über die Bühne laufen (nur Seite/¾)','Move across the stage while walking (side/¾ only)'), inst.walkMove!==false, v=>{ inst.walkMove=v; });
  check($t('Gestik beim Sprechen','Gestures while speaking'), inst.gesture!==false, v=>{ inst.gesture=v; renderCharacters(); });
  const ph=document.createElement('div'); ph.className='anim-hint'; ph.style.margin='4px 0 16px';
  ph.textContent=$t('Zeitlich begrenzte Posen (z. B. 3 s Gehen, dann Zeigen) legst du in der Timeline mit „＋ Pose“ an.','Time-limited poses (e.g. 3 s walking, then pointing) are added in the timeline with “＋ Pose”.');
  container.appendChild(ph);

  section($t('Reaktion','Reaction'));
  btnRow(trOpts(reactionOptions), inst.reaction||'none', (val)=>setInstanceReaction(inst.id,val), 'reaction-grid');
  check($t('Reaktion mit Sprechbeginn auslösen','Trigger reaction when speech starts'), inst.reactionAuto!==false, v=>{ inst.reactionAuto=v; renderObjectTimeline(); renderPanel(); });
  const rh=document.createElement('div'); rh.className='anim-hint';
  rh.textContent=(inst.reactionAuto!==false && (inst.script||'').trim())
    ? $t('Die Reaktion startet automatisch, sobald die Figur zu sprechen beginnt.','The reaction starts automatically as soon as the figure begins to speak.')
    : $t('Die Reaktion startet zur Zeit '+(inst.reactionStart||0).toFixed(1)+' s — Balken in der Timeline verschieben.','The reaction starts at '+(inst.reactionStart||0).toFixed(1)+' s — drag the bar in the timeline.');
  container.appendChild(rh);
}
function setInstanceReaction(instId, reaction){
  const inst=getCurrentScene().characters.find(c=>c.id===instId); if(!inst) return;
  inst.reaction=reaction;
  renderCharacters(); renderPanel(); renderObjectTimeline();
  const el=charEl(instId);
  if(el){ el.classList.remove('reaction-pulse'); void el.offsetWidth; el.classList.add('reaction-pulse'); }
}
function faceEachOther(id){
  const cs=getCurrentScene().characters; const a=cs.find(c=>c.id===id); if(!a||cs.length<2) return;
  let b=null, best=1e9; cs.forEach(c=>{ if(c===a) return; const d=Math.abs((c.x+c.w/2)-(a.x+a.w/2)); if(d<best){best=d;b=c;} });
  const aLeft=(a.x+a.w/2)<=(b.x+b.w/2);
  [a,b].forEach(c=>{ if(c.facing==='front'||c.facing==='back') c.facing='threeq'; });
  a.flipped=!aLeft; b.flipped=aLeft;
  renderCharacters(); renderPanel();
}

function renderScenesTab(container){
  const scene=getCurrentScene();
  const t1=document.createElement('div'); t1.className='section-title'; t1.textContent=$t('Branchen-Szenen','Industry scenes');
  container.appendChild(t1);
  const grid=document.createElement('div'); grid.className='scene-grid';
  scenes.forEach(sc=>{
    const card=document.createElement('div');
    card.className='scene-card'+(scene.bgType==='scene'&&scene.bgId===sc.id?' selected':'');
    card.innerHTML = `<div class="scene-thumb">${sc.svg}</div><div class="scene-name">${$d(sc.name)}</div>`;
    card.addEventListener('click', ()=>{ scene.bgType='scene'; scene.bgId=sc.id; renderStageBackground(); renderPanel(); renderSceneTrack(); renderObjectTimeline(); });
    grid.appendChild(card);
  });
  container.appendChild(grid);

  const t2=document.createElement('div'); t2.className='section-title'; t2.textContent=$t('Einfache Hintergründe','Plain backgrounds');
  container.appendChild(t2);
  const grid2=document.createElement('div'); grid2.className='bg-grid';
  plainBackgrounds.forEach(bg=>{
    const card=document.createElement('div');
    card.className='bg-card'+(scene.bgType==='plain'&&scene.bgId===bg.id?' selected':'');
    card.innerHTML=`<div class="bg-swatch" style="background:${bg.css}"></div><div class="bg-name">${$d(bg.name)}</div>`;
    card.addEventListener('click', ()=>{ scene.bgType='plain'; scene.bgId=bg.id; renderStageBackground(); renderPanel(); renderSceneTrack(); renderObjectTimeline(); });
    grid2.appendChild(card);
  });
  container.appendChild(grid2);
}

function renderObjTab(container){
  const uploadBtn=document.createElement('button'); uploadBtn.className='upload-btn'; uploadBtn.textContent=$t('+ Bild hochladen','+ Upload image');
  const uploadInput=document.createElement('input'); uploadInput.type='file'; uploadInput.accept='image/*'; uploadInput.style.display='none';
  uploadInput.addEventListener('change', e=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>addObjectToStage({type:'image', src:reader.result, w:90, h:90});
    reader.readAsDataURL(file);
  });
  uploadBtn.addEventListener('click', ()=>uploadInput.click());
  container.appendChild(uploadBtn); container.appendChild(uploadInput);

  const chips=document.createElement('div'); chips.className='filter-chips';
  const cats=[['alle','Alle'],['allgemein','Allgemein'],['bank','Bank'],['versicherung','Versicherung'],['arztpraxis','Arztpraxis'],['einzelhandel','Einzelhandel']].map(([k,l])=>[k,$d(l)]);
  cats.forEach(([key,label])=>{
    const chip=document.createElement('button');
    chip.className='chip'+(currentObjFilter===key?' active':''); chip.textContent=label;
    chip.addEventListener('click', ()=>{ currentObjFilter=key; renderPanel(); });
    chips.appendChild(chip);
  });
  container.appendChild(chips);

  const grid=document.createElement('div'); grid.className='obj-lib-grid';
  iconLibrary.filter(ic=>currentObjFilter==='alle'||ic.category===currentObjFilter).forEach(icon=>{
    const card=document.createElement('div'); card.className='obj-lib-card';
    card.innerHTML = icon.svg + `<div class="obj-lib-name">${$d(icon.name)}</div>`;
    card.addEventListener('click', ()=>addObjectToStage({type:'icon', iconId:icon.id, w:90, h:90}));
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function renderTextTab(container){
  const t=document.createElement('div'); t.className='section-title'; t.textContent=$t('Text hinzufügen','Add text');
  container.appendChild(t);
  const headBtn=document.createElement('button'); headBtn.className='upload-btn'; headBtn.style.fontWeight='700'; headBtn.style.fontSize='15px'; headBtn.textContent=$t('+ Überschrift','+ Heading');
  headBtn.addEventListener('click', ()=>addObjectToStage({type:'text', content:$t('Überschrift','Heading'), fontSize:36, bold:true, color:'#F4F1EA', w:300, h:64}));
  const bodyBtn=document.createElement('button'); bodyBtn.className='upload-btn'; bodyBtn.textContent=$t('+ Textzeile','+ Text line');
  bodyBtn.addEventListener('click', ()=>addObjectToStage({type:'text', content:$t('Text bearbeiten...','Edit text...'), fontSize:20, bold:false, color:'#F4F1EA', w:240, h:48}));
  container.appendChild(headBtn); container.appendChild(bodyBtn);
  const hint=document.createElement('div'); hint.className='anim-hint'; hint.style.marginTop='10px';
  hint.textContent=$t('Tipp: Doppelklick auf den Text im Stage-Bereich, um ihn zu bearbeiten.','Tip: double-click the text on the stage to edit it.');
  container.appendChild(hint);
}

function renderPanel(){
  panelContent.innerHTML='';
  if(currentTab==='chars') renderCharTab(panelContent);
  else if(currentTab==='scenes') renderScenesTab(panelContent);
  else if(currentTab==='objects') renderObjTab(panelContent);
  else if(currentTab==='animation') renderAnimationTab(panelContent);
  else if(currentTab==='text') renderTextTab(panelContent);
}

document.querySelectorAll('.rail-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const wasActiveAndOpen = btn.classList.contains('active') && document.body.classList.contains('sidebar-open');
    currentTab=btn.dataset.tab;
    document.querySelectorAll('.rail-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderPanel();
    if(wasActiveAndOpen) document.body.classList.remove('sidebar-open');
    else document.body.classList.add('sidebar-open');
  });
});
const sidebarCloseBtn=document.getElementById('sidebarCloseBtn');
if(sidebarCloseBtn) sidebarCloseBtn.addEventListener('click', ()=>document.body.classList.remove('sidebar-open'));

/* ================= Stage background ================= */
function renderStageBackground(){
  const scene=getCurrentScene();
  const el=document.getElementById('stageBackground');
  if(scene.bgType==='scene'){
    const sc=scenes.find(s=>s.id===scene.bgId);
    el.style.background='none';
    el.innerHTML=sc?sc.svg:'';
  } else {
    const bg=plainBackgrounds.find(b=>b.id===scene.bgId)||plainBackgrounds[0];
    el.innerHTML='';
    el.style.background=bg.css;
  }
}

/* ================= Stage characters: mehrere Figuren pro Szene ================= */
/* Bühne: feste logische Größe 960×540, wird per Skalierung in den verfügbaren Platz eingepasst */
const STAGE_W=960, STAGE_H=540;
let STAGE_K=1;
function fitStage(){
  const area=document.getElementById('stageArea'); if(!area) return;
  const pad=area.clientWidth<600?8:18;
  const k=Math.max(0.2, Math.min((area.clientWidth-pad*2)/STAGE_W, (area.clientHeight-pad*2)/STAGE_H));
  STAGE_K=k; const sc=document.getElementById('stageScaler'); sc.style.setProperty('--k',k.toFixed(4)); sc.style.setProperty('--bfs',Math.max(17,9.5/k).toFixed(1)+'px');
}
window.addEventListener('resize',fitStage);
if('ResizeObserver' in window) new ResizeObserver(fitStage).observe(document.getElementById('stageArea'));
fitStage();
function charEl(id){ return document.querySelector('.stage-character[data-inst-id="'+id+'"]'); }
function objEl(id){ return document.querySelector('.stage-object[data-obj-id="'+id+'"]'); }
function addCharacterToStage(charDefId){
  const scene=getCurrentScene();
  const sw=STAGE_W, sh=STAGE_H;
  const w=Math.round(sw*0.21), h=Math.round(w*1.7);
  const n=scene.characters.length;
  const x=Math.max(4, Math.min(Math.round(sw*0.08 + n*(w*1.05)), sw-w-4));
  const y=Math.max(4, Math.round(sh - h - sh*0.02));
  const def=characters.find(c=>c.id===charDefId)||{};
  const inst={id:'ch'+(charInstCounter++), charId:charDefId, x, y, w, h, action:'idle', reaction:'none', reactionStart:0, reactionDur:2.5, reactionAuto:true,
    flipped:false, facing:'front', clips:[], walkMove:true, gesture:true, script:'', voiceName:'', rate:1, pitch:def.female?1.12:0.9, audio:true, bubble:true, speechStart:0, lang:LANG, clip:null};
  // neue Figur spricht standardmäßig nach der letzten Figur
  inst.speechStart=Math.round(scene.characters.reduce((m,c)=>Math.max(m,(c.speechStart||0)+((c.script||'').trim()?estimateSpeechDuration(c):0)),0)*10)/10;
  scene.characters.push(inst);
  selectedEntity={kind:'char', id:inst.id};
  renderCharacters(); renderSpeakerTracks(); renderObjectTimeline();
  return inst;
}
function bringCharToFront(id){ const cs=getCurrentScene().characters; const i=cs.findIndex(c=>c.id===id); if(i<0) return; const [c]=cs.splice(i,1); cs.push(c); renderCharacters(); }
function sendCharToBack(id){ const cs=getCurrentScene().characters; const i=cs.findIndex(c=>c.id===id); if(i<0) return; const [c]=cs.splice(i,1); cs.unshift(c); renderCharacters(); }
function toggleCharFlip(id){ const c=getCurrentScene().characters.find(c=>c.id===id); if(!c) return; c.flipped=!c.flipped; renderCharacters(); }

/* Laufzeit-Zustand (nur während der Wiedergabe): Pose, Stimmung, Sprechen, aktuelle Mundform */
let rt={};
const MOOD_V={none:'rest',joy:'joy',anger:'anger',surprise:'surprise',news:'joy',listening:'rest'};
function setClassPrefix(el,prefix,val){
  Array.from(el.classList).forEach(c=>{ if(c.indexOf(prefix)===0) el.classList.remove(c); });
  if(val) el.classList.add(prefix+val);
}
function rigState(inst){
  if(Player.running) return rt[inst.id]||(rt[inst.id]={pose:inst.action||'idle',mood:'none',talking:false,v:null});
  return {pose:inst.action||'idle', mood:inst.reaction||'none', talking:false, v:null};
}
function applyRig(inst){
  const el=charEl(inst.id); if(!el) return;
  const s=rigState(inst);
  setClassPrefix(el,'pose-',s.pose);
  setClassPrefix(el,'mood-',s.mood);
  el.classList.toggle('talking', !!s.talking);
  el.classList.toggle('gest', inst.gesture!==false);
  el.dataset.v = s.v || MOOD_V[s.mood] || 'rest';
}
function setViseme(inst,v){
  const s=rigState(inst); s.v=v;
  const el=charEl(inst.id); if(el) el.dataset.v = v || MOOD_V[s.mood] || 'rest';
}

/* ================= Timeline: Balken verschieben / Dauer ziehen ================= */
/* Jede Zeile besteht aus beliebig vielen Balken. Ein Balken-Objekt (cfg):
   {start, dur|null, color, text | options+selectValue+onSelect, move(s), resize(d), minDur, done(), onClick(), warn, title, className}
   dur=null bedeutet „bis Szenenende“. */
const TL_MIN_PCT=9;
function attachBarDrag(bar, track, sceneDur, cfg){
  if(!cfg.move){ if(cfg.onClick) bar.addEventListener('click', cfg.onClick); return; }
  bar.addEventListener('pointerdown', e=>{
    if(e.target.closest('select,button,.timeline-bar-handle')) return;
    e.preventDefault(); e.stopPropagation();
    try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    const rect=track.getBoundingClientRect();
    const x0=e.clientX, left0=bar.offsetLeft, bw=bar.offsetWidth;
    const untilEnd=(cfg.dur==null);               // „bis Szenenende“: linke Kante wandert, rechte bleibt
    const minW=rect.width*TL_MIN_PCT/100;
    let moved=false;
    const mv=ev=>{
      const dx=ev.clientX-x0; if(Math.abs(dx)>3) moved=true; if(!moved) return;
      const maxLeft=untilEnd?Math.max(0,rect.width-minW):Math.max(0,rect.width-bw);
      const leftPx=Math.max(0, Math.min(maxLeft, left0+dx));
      const s=Math.round((leftPx/rect.width*sceneDur)*10)/10;
      cfg.move(s);
      bar.style.left=(s/sceneDur*100)+'%';
      if(untilEnd) bar.style.width=Math.max(TL_MIN_PCT,(sceneDur-s)/sceneDur*100)+'%';
      bar.dataset.tip=s.toFixed(1)+' s'; bar.classList.add('dragging');
    };
    const up=()=>{
      bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); bar.removeEventListener('pointercancel',up);
      bar.classList.remove('dragging');
      if(moved){ if(cfg.done) cfg.done(); } else if(cfg.onClick) cfg.onClick();
    };
    bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up); bar.addEventListener('pointercancel',up);
  });
  if(cfg.resize){
    const handle=document.createElement('div'); handle.className='timeline-bar-handle'; handle.title=$t('Dauer ziehen','Drag to change duration');
    handle.addEventListener('pointerdown', e=>{
      e.preventDefault(); e.stopPropagation();
      try{ handle.setPointerCapture(e.pointerId); }catch(_){}
      const rect=track.getBoundingClientRect(); const x0=e.clientX, w0=bar.offsetWidth; let moved=false;
      const mv=ev=>{
        moved=true;
        const wPx=Math.max(12,w0+(ev.clientX-x0));
        const d=Math.max(cfg.minDur||0.3, Math.round((wPx/rect.width*sceneDur)*10)/10);
        cfg.resize(d);
        bar.style.width=Math.min(100-parseFloat(bar.style.left||0), Math.max(TL_MIN_PCT,d/sceneDur*100))+'%';
        bar.dataset.tip=d.toFixed(1)+' s'; bar.classList.add('dragging');
      };
      const up=()=>{
        handle.removeEventListener('pointermove',mv); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up);
        bar.classList.remove('dragging'); if(moved && cfg.done) cfg.done();
      };
      handle.addEventListener('pointermove',mv); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
    });
    bar.appendChild(handle);
  }
}
function makeTimelineRow(labelText, bars, sceneDur, opts){
  opts=opts||{};
  const row=document.createElement('div'); row.className='timeline-grid-row';
  const label=document.createElement('div'); label.className='timeline-row-label'; label.title=labelText;
  const lt=document.createElement('span'); lt.textContent=labelText; label.appendChild(lt);
  if(opts.add){
    const add=document.createElement('button'); add.className='timeline-add'; add.textContent=opts.add.text||'＋'; add.title=opts.add.title||'';
    add.addEventListener('click', opts.add.onClick); label.appendChild(add);
  }
  row.appendChild(label);
  const track=document.createElement('div'); track.className='timeline-row-track';
  bars.forEach(b=>{
    const durS=(b.dur==null)?Math.max(0.3,sceneDur-b.start):b.dur;
    const widthPct=Math.min(100,Math.max(TL_MIN_PCT, durS/sceneDur*100));
    const leftPct=Math.max(0,Math.min(b.start/sceneDur*100, 100-widthPct));
    const bar=document.createElement('div');
    bar.className='timeline-bar'+(b.move?' draggable-bar':'')+(b.className?' '+b.className:'')+(b.warn?' warn':'');
    bar.style.left=leftPct+'%'; bar.style.width=widthPct+'%';
    bar.style.background=b.color||'var(--panel-border)';
    if(b.title) bar.title=b.title;
    if(b.options){
      const sel=document.createElement('select');
      b.options.forEach(([val,lab])=>{ const o=document.createElement('option'); o.value=val; o.textContent=$d(lab); sel.appendChild(o); });
      sel.value=b.selectValue;
      sel.addEventListener('pointerdown', e=>e.stopPropagation());
      sel.addEventListener('change', ()=>b.onSelect(sel.value));
      bar.appendChild(sel);
    } else if(b.text){
      const span=document.createElement('span'); span.textContent=b.text; bar.appendChild(span);
    }
    attachBarDrag(bar, track, sceneDur, b);
    track.appendChild(bar);
  });
  const cur=document.createElement('div'); cur.className='tl-cursor'; track.appendChild(cur);
  row.appendChild(track);
  return row;
}
function addPoseClip(inst){
  const D=getCurrentScene().duration;
  inst.clips=inst.clips||[];
  const last=inst.clips.reduce((m,c)=>Math.max(m,c.start+c.dur),0);
  const start=Math.max(0,Math.min(Math.round(last*10)/10, D-1));
  const dur=Math.max(0.5, Math.min(2.5, D-start));
  inst.clips.push({id:'cl'+(clipCounter++), start, dur, pose: inst.clips.length===0?'walk':'point'});
  inst.clips.sort((a,b)=>a.start-b.start);
  renderObjectTimeline();
}

function renderObjectTimeline(){
  const scene=getCurrentScene();
  document.getElementById('objTimelineSceneLabel').textContent=$d(scene.label);
  const durInput=document.getElementById('sceneDurationInput');
  if(document.activeElement!==durInput) durInput.value=scene.duration;
  const D=scene.duration;

  const ruler=document.getElementById('objRuler');
  ruler.innerHTML='';
  const step = D<=10?1:(D<=30?5:10);
  for(let t=0;t<=D;t+=step){
    const tick=document.createElement('div'); tick.className='timeline-tick';
    tick.style.left=(t/D*100)+'%'; tick.textContent=t+'s'; ruler.appendChild(tick);
  }
  const rcur=document.createElement('div'); rcur.className='tl-cursor'; ruler.appendChild(rcur);

  const rows=document.getElementById('timelineRows');
  rows.innerHTML='';

  // Sprachspannen (geschätzt) und Überschneidungen
  const spans=scene.characters.filter(c=>(c.script||'').trim()).map(c=>({inst:c,s:c.speechStart||0,e:(c.speechStart||0)+estimateSpeechDuration(c)}));
  let anyOverlap=false, maxEnd=0;
  spans.forEach(sp=>{ sp.overlap=spans.some(o=>o!==sp && o.s<sp.e-0.05 && sp.s<o.e-0.05); if(sp.overlap) anyOverlap=true; maxEnd=Math.max(maxEnd,sp.e); });

  scene.characters.forEach(inst=>{
    const def=characters.find(c=>c.id===inst.charId); if(!def) return;
    const text=(inst.script||'').trim();
    const sp=spans.find(x=>x.inst===inst);

    // --- Sprache ---
    if(sp){
      rows.appendChild(makeTimelineRow($d(def.name)+' · '+$t('Sprache','Speech'),[{
        start:sp.s, dur:sp.e-sp.s, color:'var(--accent-teal)', text:'“'+text+'”', warn:sp.overlap||sp.e>D+0.05,
        title:$d(def.name)+': '+sp.s.toFixed(1)+' s – '+sp.e.toFixed(1)+' s'+(sp.overlap?$t(' · überschneidet sich mit einer anderen Stimme (wird nacheinander gesprochen)',' · overlaps another voice (spoken one after the other)'):'')+(sp.e>D+0.05?$t(' · endet nach Szenenende',' · ends after the scene end'):'')+$t(' — ziehen zum Verschieben, tippen zum Bearbeiten',' — drag to move, tap to edit'),
        move:(v)=>{ inst.speechStart=v; }, done:()=>{ renderObjectTimeline(); renderSpeakerTracks(); },
        onClick:()=>focusSpeakerLine(inst.id)
      }], D));
    } else {
      rows.appendChild(makeTimelineRow($d(def.name)+' · '+$t('Sprache','Speech'),[{start:0,dur:null,color:'transparent',className:'ghost',text:$t('kein Sprechtext – unten in der Sprecherspur eintragen','no speech text – enter it in the speaker track below')}], D));
    }

    // --- Pose-Clips ---
    const clips=inst.clips||(inst.clips=[]);
    const poseBars=clips.map(c=>({
      start:c.start, dur:c.dur, color:'var(--accent-violet)', minDur:0.5,
      options:poseOptions.concat([['__del',$t('✕ Entfernen','✕ Remove')]]), selectValue:c.pose,
      title:$t('Pose-Clip: ','Pose clip: ')+c.start.toFixed(1)+' s, '+c.dur.toFixed(1)+' s',
      onSelect:(v)=>{ if(v==='__del') inst.clips=inst.clips.filter(x=>x!==c); else c.pose=v; renderObjectTimeline(); },
      move:(v)=>{ c.start=v; }, resize:(d)=>{ c.dur=d; }, done:()=>{ inst.clips.sort((a,b)=>a.start-b.start); renderObjectTimeline(); }
    }));
    if(!poseBars.length) poseBars.push({start:0,dur:null,color:'transparent',className:'ghost',text:$t('Grundpose: ','Base pose: ')+$d((poseOptions.find(p=>p[0]===(inst.action||'idle'))||[])[1]||'Stehen')+$t(' — „＋“ für zeitlich begrenzte Pose',' — “＋” for a time-limited pose')});
    rows.appendChild(makeTimelineRow($d(def.name)+' · '+$t('Pose','Pose'), poseBars, D, {add:{text:'＋',title:$t('Pose-Clip hinzufügen','Add pose clip'),onClick:()=>addPoseClip(inst)}}));

    // --- Reaktion (an Sprechbeginn gekoppelt oder feste Zeit) ---
    const coupled=inst.reactionAuto!==false && !!text;
    const rs=coupled?(sp?sp.s:0):(inst.reactionStart||0);
    const rd=coupled?Math.max(1,sp?sp.e-sp.s:1):(inst.reactionDur||2.5);
    rows.appendChild(makeTimelineRow($d(def.name)+' · '+$t('Reaktion','Reaction'),[{
      start:rs, dur:rd, color:inst.reaction&&inst.reaction!=='none'?'var(--accent-pink)':'var(--panel-border)', minDur:0.5,
      options:reactionOptions.concat([['__couple',$t('⚡ mit Sprechbeginn','⚡ with speech start')]]), selectValue:inst.reaction||'none',
      title:coupled?$t('Startet automatisch, sobald '+$d(def.name)+' zu sprechen beginnt (Balken ziehen = feste Zeit)',
        'Starts automatically as soon as '+$d(def.name)+' begins to speak (drag the bar = fixed time)'):$t('Startet bei '+rs.toFixed(1)+' s','Starts at '+rs.toFixed(1)+' s'),
      onSelect:(v)=>{ if(v==='__couple'){ inst.reactionAuto=true; renderObjectTimeline(); if(currentTab==='animation') renderPanel(); } else setInstanceReaction(inst.id,v); },
      move:(v)=>{ inst.reactionStart=v; inst.reactionAuto=false; },
      resize:coupled?null:(d)=>{ inst.reactionDur=d; },
      done:()=>{ renderObjectTimeline(); if(currentTab==='animation') renderPanel(); }
    }], D));
  });

  // --- Objekte ---
  scene.objects.forEach(obj=>{
    let label='Text';
    if(obj.type==='icon'){ const d=iconLibrary.find(i=>i.id===obj.iconId); label=$d(d?d.name:'Objekt'); }
    else if(obj.type==='image') label=$d('Bild');
    else if(obj.content) label='Text: '+obj.content.slice(0,14);
    if(obj.timelineStart===undefined) obj.timelineStart=0;
    rows.appendChild(makeTimelineRow(label,[{
      start:obj.timelineStart, dur:obj.timelineDuration==null?null:obj.timelineDuration, color:'var(--accent-amber)', minDur:0.3,
      options:effectOptions, selectValue:obj.effect||'none',
      title:$t('Erscheint bei '+obj.timelineStart.toFixed(1)+' s'+(obj.timelineDuration==null?' und bleibt bis Szenenende':' für '+obj.timelineDuration.toFixed(1)+' s'),
        'Appears at '+obj.timelineStart.toFixed(1)+' s'+(obj.timelineDuration==null?' and stays until the scene ends':' for '+obj.timelineDuration.toFixed(1)+' s')),
      onSelect:(v)=>{ obj.effect=v; renderObjectTimeline(); },
      move:(v)=>{ obj.timelineStart=v; },
      resize:(d)=>{ obj.timelineDuration=(obj.timelineStart+d>=D-0.05)?null:d; },
      done:()=>renderObjectTimeline()
    }], D));
  });

  // --- Hintergrund & Musik ---
  let bgLabel='Hintergrund';
  if(scene.bgType==='scene'){ const sc=scenes.find(s=>s.id===scene.bgId); bgLabel=sc?sc.name:bgLabel; }
  else { const bg=plainBackgrounds.find(b=>b.id===scene.bgId); bgLabel=bg?bg.name:bgLabel; }
  bgLabel=$d(bgLabel);
  rows.appendChild(makeTimelineRow($d('Hintergrund'),[{
    start:0,dur:null,color:'#C9A227',text:bgLabel,
    onClick:()=>{
      currentTab='scenes';
      document.querySelectorAll('.rail-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab==='scenes'));
      renderPanel(); document.body.classList.add('sidebar-open');
    }
  }], D));
  rows.appendChild(makeTimelineRow($d('Musik'),[{
    start:0,dur:null,color:scene.bgMusic&&scene.bgMusic!=='none'?'var(--accent-violet)':'var(--panel-border)',
    options:musicOptions, selectValue:scene.bgMusic||'none',
    onSelect:(v)=>{ scene.bgMusic=v; renderObjectTimeline(); if(v!=='none') Music.preview(v); }
  }], D));

  // Hinweis zu Sprache vs. Szenenlänge
  const hint=document.getElementById('timelineHint'); hint.innerHTML='';
  if(maxEnd>D+0.05){
    const need=Math.ceil(maxEnd+0.4);
    const s=document.createElement('span'); s.textContent=$t('Sprache endet bei ca. '+maxEnd.toFixed(1)+' s – Szene wird beim Abspielen bis zum Sprechende verlängert. ','Speech ends at approx. '+maxEnd.toFixed(1)+' s – the scene is extended to the end of speech during playback. ');
    const b=document.createElement('button'); b.className='ctrl-btn ctrl-btn-sm'; b.textContent=$t('Szene auf '+Math.min(60,need)+' s verlängern','Extend scene to '+Math.min(60,need)+' s');
    b.addEventListener('click',()=>{ scene.duration=Math.min(60,need); renderObjectTimeline(); renderMasterTimeline(); });
    hint.appendChild(s); hint.appendChild(b);
  } else if(anyOverlap){
    hint.textContent=$t('Sprecher überschneiden sich – Stimmen werden nacheinander gesprochen (immer nur eine Stimme gleichzeitig).','Speakers overlap – voices are spoken one after the other (only one voice at a time).');
  }
}

/* ================= Stimmquellen: eigener TTS-Server (z. B. Piper) ================= */
function audioDuration(url){
  return new Promise((res,rej)=>{
    const a=new Audio(); a.preload='metadata'; const to=setTimeout(()=>rej(new Error('timeout')),8000);
    a.onloadedmetadata=()=>{ clearTimeout(to); res(isFinite(a.duration)?a.duration:0); };
    a.onerror=()=>{ clearTimeout(to); rej(new Error('audio')); };
    a.src=url;
  });
}
const Remote={
  url:'', voice:'', cache:new Map(), dur:new Map(),
  load(){ try{ const o=JSON.parse(localStorage.getItem('sh-remote')||'{}'); this.url=o.url||''; this.voice=o.voice||''; }catch(_){} },
  save(){ try{ localStorage.setItem('sh-remote',JSON.stringify({url:this.url,voice:this.voice})); }catch(_){} },
  on(){ return !!this.url; },
  key(text,lang){ return lang+'|'+this.voice+'|'+text; },
  get(text,lang){
    const k=this.key(text,lang); let p=this.cache.get(k); if(p) return p;
    p=this._fetch(text,lang).then(async blob=>{ const url=URL.createObjectURL(blob); let d=0; try{ d=await audioDuration(url); }catch(_){} this.dur.set(k,d); return {url,dur:d}; });
    p.catch(()=>{ if(this.cache.get(k)===p) this.cache.delete(k); });
    this.cache.set(k,p);
    if(this.cache.size>40){ const first=this.cache.keys().next().value; const old=this.cache.get(first); this.cache.delete(first); old.then(o=>URL.revokeObjectURL(o.url)).catch(()=>{}); }
    return p;
  },
  async _fetch(text,lang){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),15000);
    try{
      let res;
      if(this.url.indexOf('{text}')>=0){
        res=await fetch(this.url.replace('{text}',encodeURIComponent(text)).replace('{lang}',encodeURIComponent(lang)).replace('{voice}',encodeURIComponent(this.voice)),{signal:ctl.signal});
      } else {
        res=await fetch(this.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,lang,voice:this.voice}),signal:ctl.signal});
      }
      if(!res.ok) throw new Error('HTTP '+res.status);
      const blob=await res.blob(); if(!blob.size) throw new Error('empty');
      return blob;
    } finally { clearTimeout(to); }
  }
};
Remote.load();

/* ================= Sprecheraudio je Figur ================= */
function instLang(inst){ return (inst&&inst.lang)==='en'?'en':'de'; }
function isLangVoice(v,lang){ return new RegExp('^'+lang+'([-_]|$)','i').test(v.lang||''); }
function isGermanVoice(v){ return isLangVoice(v,'de'); }
function voiceScore(v,lang){
  lang=lang||'de';
  const n=(v.name||'')+' '+(v.voiceURI||'');
  let s=isLangVoice(v,lang)?100:0;
  if(/natural|neural|online|multilingual/i.test(n)) s+=45;
  if(/premium|enhanced|erweitert|verbessert|siri/i.test(n)) s+=35;
  if(/google/i.test(n)) s+=12;
  if(v.localService) s+=3;
  if(lang==='en' && /^en[-_](US|GB)$/i.test(v.lang||'')) s+=4;
  return s;
}
function voiceLabel(v,lang){ return (voiceScore(v,lang)>=135?'★ ':'')+v.name+' ('+v.lang+')'+(v.localService?'':' · online'); }
function groupedVoices(lang){
  lang=lang||'de';
  const vs=Speech.voices.slice();
  const by=(a,b)=>voiceScore(b,lang)-voiceScore(a,lang)||a.name.localeCompare(b.name);
  const main=vs.filter(v=>isLangVoice(v,lang)).sort(by);
  return {main, de:main, other:vs.filter(v=>!isLangVoice(v,lang)).sort((a,b)=>a.name.localeCompare(b.name))};
}
function populateVoiceSelect(sel, current, lang){
  lang=lang||'de';
  const g=groupedVoices(lang);
  const nm=lang==='en'?$t('englische','English'):$t('deutsche','German');
  sel.innerHTML='';
  const auto=document.createElement('option'); auto.value='';
  auto.textContent=g.main.length?$t('Automatisch (beste '+nm+' Stimme)','Automatic (best '+nm+' voice)'):$t('Automatisch','Automatic');
  sel.appendChild(auto);
  if(Remote.on()){ const o=document.createElement('option'); o.value='__remote'; o.textContent=$t('Eigener TTS-Server','Own TTS server'); sel.appendChild(o); }
  if(g.main.length){ const og=document.createElement('optgroup'); og.label=lang==='en'?$t('Englisch','English'):$t('Deutsch','German'); g.main.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=voiceLabel(v,lang); og.appendChild(o); }); sel.appendChild(og); }
  if(g.other.length){ const og=document.createElement('optgroup'); og.label=$t('Andere Sprachen','Other languages'); g.other.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=voiceLabel(v,lang); og.appendChild(o); }); sel.appendChild(og); }
  sel.value=current||'';
  if(sel.value!==(current||'')) sel.value='';
}
function refreshVoiceSelects(){
  document.querySelectorAll('.speaker-voice').forEach(sel=>{
    const inst=getCurrentScene().characters.find(c=>c.id===sel.dataset.instId);
    populateVoiceSelect(sel, inst?inst.voiceName:'', instLang(inst));

}
function setInstLang(inst, lang){
  inst.lang=lang==='en'?'en':'de';
  // gewählte Stimme passt nicht mehr zur Sprache → automatische Wahl
  if(inst.voiceName && inst.voiceName!=='__remote'){ const v=Speech.voices.find(v=>v.name===inst.voiceName); if(!v||!isLangVoice(v,inst.lang)) inst.voiceName=''; }
  renderSpeakerTracks(); renderObjectTimeline();
}

function renderSpeakerTracks(){
  const scene=getCurrentScene();
  document.getElementById('speakerSceneLabel').textContent=$d(scene.label);
  const host=document.getElementById('speakerTracks');
  host.innerHTML='';
  if(scene.characters.length===0){
    const hint=document.createElement('div'); hint.className='speaker-empty-hint';
    hint.textContent=$t('Noch keine Figur in dieser Szene platziert – füge über den Tab „Charaktere“ eine hinzu.','No figure placed in this scene yet – add one via the “Characters” tab.');

    const row=document.createElement('div'); row.className='speaker-track'; row.dataset.instId=inst.id;

    row.appendChild(avatar);
    const name=document.createElement('div'); name.className='speaker-name'; name.textContent=$d(def.name); name.title=$d(def.name)+' – '+$d(def.tag);
    row.appendChild(name);

    const line=document.createElement('input'); line.type='text'; line.className='speaker-line'; line.dataset.instId=inst.id;

    line.addEventListener('input', ()=>{ inst.script=line.value; renderObjectTimeline(); if(currentTab==='animation') renderPanel(); });
    line.lang=instLang(inst); line.spellcheck=true;
    row.appendChild(line);

    const playBtn=document.createElement('button'); playBtn.className='ctrl-btn ctrl-btn-sm primary speaker-play'; playBtn.textContent='▶'; playBtn.title=$t('Zeile anhören','Listen to this line');

    row.appendChild(playBtn);
    const stopBtn=document.createElement('button'); stopBtn.className='ctrl-btn ctrl-btn-sm'; stopBtn.textContent='■'; stopBtn.title=$t('Stopp','Stop');
    stopBtn.addEventListener('click', ()=>Player.stop());
    row.appendChild(stopBtn);

    const opts=document.createElement('div'); opts.className='speaker-opts';
    const mk=(cls,title,child)=>{ const w=document.createElement('label'); w.className='speaker-opt '+cls; const s=document.createElement('span'); s.className='speaker-opt-lbl'; s.textContent=title; w.appendChild(s); w.appendChild(child); opts.appendChild(w); return w; };

    const startInput=document.createElement('input'); startInput.type='number'; startInput.className='speaker-start'; startInput.min='0'; startInput.step='0.1'; startInput.dataset.instId=inst.id;
    startInput.value=(inst.speechStart||0).toFixed(1);
    startInput.addEventListener('input', ()=>{ inst.speechStart=Math.max(0,parseFloat(startInput.value)||0); renderObjectTimeline(); });
    const sw=mk('opt-start',$t('Start (s)','Start (s)'),startInput); sw.title=$t('Startzeit innerhalb der Szene – auch per Balken in der Timeline verschiebbar','Start time within the scene – can also be moved with the bar in the timeline');

    const langSel=document.createElement('select'); langSel.className='speaker-lang'; langSel.dataset.instId=inst.id;
    [['de','Deutsch'],['en','English']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; langSel.appendChild(o); });
    langSel.value=instLang(inst);
    langSel.addEventListener('change', ()=>{ setInstLang(inst, langSel.value); });
    mk('opt-lang',$t('Sprache','Language'),langSel).title=$t('Sprache des Sprechtexts (bestimmt Stimmenauswahl und Mundformen)','Language of the spoken text (determines voice choice and mouth shapes)');

    const voice=document.createElement('select'); voice.className='speaker-voice'; voice.dataset.instId=inst.id;

    mk('opt-voice',$t('Stimme','Voice'),voice);

    const rate=document.createElement('input'); rate.type='range'; rate.min='0.6'; rate.max='1.5'; rate.step='0.05'; rate.value=inst.rate||1; rate.className='speaker-rate';

    rate.addEventListener('input',()=>{ inst.rate=parseFloat(rate.value); rv.textContent=inst.rate.toFixed(2)+'×'; });
    rate.addEventListener('change',()=>renderObjectTimeline());
    const rw=mk('opt-rate',$t('Tempo','Speed'),rate); rw.appendChild(rv);

    const pitch=document.createElement('input'); pitch.type='range'; pitch.min='0.6'; pitch.max='1.5'; pitch.step='0.05'; pitch.value=inst.pitch||1; pitch.className='speaker-pitch';
    const pv=document.createElement('span'); pv.className='speaker-val'; pv.textContent=(inst.pitch||1).toFixed(2);
    pitch.addEventListener('input',()=>{ inst.pitch=parseFloat(pitch.value); pv.textContent=inst.pitch.toFixed(2); });
    const pw=mk('opt-pitch',$t('Tonhöhe','Pitch'),pitch); pw.appendChild(pv);

    const audio=document.createElement('input'); audio.type='checkbox'; audio.checked=inst.audio!==false; audio.className='speaker-audio';

    mk('opt-audio',$t('Ton','Sound'),audio).title=$t('Sprachausgabe an/aus (aus = nur Sprechblase und Lippenbewegung)','Speech output on/off (off = speech bubble and lip movement only)');
    const bub=document.createElement('input'); bub.type='checkbox'; bub.checked=inst.bubble!==false; bub.className='speaker-bubble';
    bub.addEventListener('change',()=>{ inst.bubble=bub.checked; });
    mk('opt-bubble',$t('Sprechblase','Speech bubble'),bub);

    // Eigene Audiodatei (z. B. aus einem hochwertigen TTS-Dienst oder selbst aufgenommen) – Lippen/Blase laufen im Takt der Datei
    const clipBox=document.createElement('div'); clipBox.className='speaker-opt opt-clip';
    const fi=document.createElement('input'); fi.type='file'; fi.accept='audio/*'; fi.style.display='none'; fi.className='speaker-clipfile'; fi.dataset.instId=inst.id;
    const cb=document.createElement('button'); cb.type='button'; cb.className='ctrl-btn ctrl-btn-sm speaker-clipbtn';
    cb.textContent=inst.clip?('🎵 '+inst.clip.name):$t('🎵 Audiodatei','🎵 Audio file');
    cb.title=inst.clip?$t('Audiodatei ersetzen (Sprechtext dient als Transkript für Blase und Lippen)','Replace audio file (the speaker text acts as transcript for bubble and lips)'):$t('Eigene Audiodatei statt Computerstimme verwenden (Sprechtext = Transkript für Blase und Lippen)','Use your own audio file instead of a synthetic voice (speaker text = transcript for bubble and lips)');
    cb.addEventListener('click', ()=>fi.click());
    fi.addEventListener('change', async ()=>{
      const f=fi.files&&fi.files[0]; if(!f) return;
      const url=URL.createObjectURL(f); let dur=0;
      try{ dur=await audioDuration(url); }catch(_){ URL.revokeObjectURL(url); alert($t('Diese Audiodatei konnte nicht gelesen werden.','This audio file could not be read.')); return; }
      if(inst.clip) URL.revokeObjectURL(inst.clip.url);
      inst.clip={name:f.name,url,dur}; renderSpeakerTracks(); renderObjectTimeline();
    });
    clipBox.appendChild(fi); clipBox.appendChild(cb);
    if(inst.clip){
      const x=document.createElement('button'); x.type='button'; x.className='ctrl-btn ctrl-btn-sm speaker-clipdel'; x.textContent='✕'; x.title=$t('Audiodatei entfernen','Remove audio file');
      x.addEventListener('click', ()=>{ URL.revokeObjectURL(inst.clip.url); inst.clip=null; renderSpeakerTracks(); renderObjectTimeline(); });
      clipBox.appendChild(x);
    }
    opts.appendChild(clipBox);

    row.appendChild(opts);
    host.appendChild(row);
  });
}

/* ================= Text → Visemen (deutsche Aussprache-Näherung) ================= */
const VIS_VOW={a:'a',e:'e',i:'i',o:'o',u:'u',ä:'e',ö:'o',ü:'u',y:'u'};
const VIS_REDUCE={a:'e',e:'i',i:'i',o:'u',u:'u'};      // Konsonanten halten die Mundform halb offen
const DIGIT_WORDS=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
function wordToVisemesDE(raw){
  let w=raw.toLowerCase().replace(/ß/g,'ss').replace(/[éèêë]/g,'e').replace(/[àáâ]/g,'a').replace(/[óô]/g,'o').replace(/[úû]/g,'u').replace(/ç/g,'s').replace(/ñ/g,'n').replace(/[’'\-]/g,'');
  w=w.replace(/[0-9]/g,d=>DIGIT_WORDS[+d]);
  const V='aeiouäöüy', isV=c=>!!c && V.indexOf(c)>=0;
  const out=[]; let i=0;
  while(i<w.length){
    const c=w[i], d=w.substr(i,2), t=w.substr(i,3);
    if(t==='sch'){ out.push(['u',1]); i+=3; continue; }
    if(d==='ch'){ out.push([null,.8]); i+=2; continue; }
    if(d==='ph'){ out.push(['fv',1]); i+=2; continue; }
    if(d==='pf'){ out.push(['mm',.5]); out.push(['fv',.8]); i+=2; continue; }
    if(d==='qu'){ out.push(['u',.9]); i+=2; continue; }
    if(d==='ei'||d==='ai'||d==='ay'||d==='ey'){ out.push(['a',1.2]); out.push(['i',1.1]); i+=2; continue; }
    if(d==='au'){ out.push(['a',1.2]); out.push(['u',1.1]); i+=2; continue; }
    if(d==='eu'||d==='äu'){ out.push(['o',1.1]); out.push(['i',1.1]); i+=2; continue; }
    if(d==='ie'){ out.push(['i',2]); i+=2; continue; }
    if(isV(c)){
      let long=false;
      if(w[i+1]===c){ long=true; i++; }
      else if(w[i+1]==='h' && !isV(w[i+2])) long=true;
      else if(w[i+1] && !isV(w[i+1]) && isV(w[i+2])) long=true;
      else if(!w[i+1]) long=true;
      out.push([VIS_VOW[c], long?2.2:1.5]); i++; continue;
    }
    if('bpm'.indexOf(c)>=0){ out.push(['mm',.9]); i++; continue; }
    if('fvw'.indexOf(c)>=0){ out.push(['fv',.9]); i++; continue; }
    out.push([null,.65]); i++;
  }
  return finalizeVisemes(out);
}
/* neutrale Konsonanten übernehmen die (verkleinerte) Mundform des Nachbarvokals; gleiche Formen werden zusammengefasst */
function finalizeVisemes(out){
  let last=null;

  out.forEach(o=>{ const m=merged[merged.length-1]; if(m && m[0]===o[0]) m[1]+=o[1]; else merged.push([o[0],o[1]]); });
