  document.getElementById('speakerSceneLabel').textContent=$d(scene.label);
  const host=document.getElementById('speakerTracks');
  host.innerHTML='';
  if(scene.characters.length===0){
    const hint=document.createElement('div'); hint.className='speaker-empty-hint';
    hint.textContent=$t('Noch keine Figur in dieser Szene platziert – füge über den Tab „Charaktere“ eine hinzu.','No figure placed in this scene yet – add one via the “Characters” tab.');
    host.appendChild(hint);
    return;
  }
  scene.characters.forEach(inst=>{
    const def=characters.find(c=>c.id===inst.charId); if(!def) return;
    const row=document.createElement('div'); row.className='speaker-track'; row.dataset.instId=inst.id;

    const avatar=document.createElement('div'); avatar.className='speaker-avatar';
    avatar.innerHTML=characterSVG(def,'sp-'+inst.id,'front',{avatar:true});
    row.appendChild(avatar);
    const name=document.createElement('div'); name.className='speaker-name'; name.textContent=$d(def.name); name.title=$d(def.name)+' – '+$d(def.tag);
    row.appendChild(name);

    const line=document.createElement('input'); line.type='text'; line.className='speaker-line'; line.dataset.instId=inst.id;
    line.placeholder=inst.clip?$t('Transkript für Sprechblase & Lippen – '+$d(def.name)+' …','Transcript for bubble & lips – '+$d(def.name)+' …'):$t('Sprechertext für '+$d(def.name)+' …','Speaker text for '+$d(def.name)+' …');
    line.value=inst.script||'';
    line.addEventListener('input', ()=>{ inst.script=line.value; renderObjectTimeline(); if(currentTab==='animation') renderPanel(); });
    line.lang=instLang(inst); line.spellcheck=true;
    row.appendChild(line);

    const playBtn=document.createElement('button'); playBtn.className='ctrl-btn ctrl-btn-sm primary speaker-play'; playBtn.textContent='▶'; playBtn.title=$t('Zeile anhören','Listen to this line');
    playBtn.addEventListener('click', ()=>Player.startLine(inst));
    row.appendChild(playBtn);
    const stopBtn=document.createElement('button'); stopBtn.className='ctrl-btn ctrl-btn-sm'; stopBtn.textContent='■'; stopBtn.title=$t('Stopp','Stop');
    stopBtn.addEventListener('click', ()=>Player.stop());
    row.appendChild(stopBtn);

    const opts=document.createElement('div'); opts.className='speaker-opts';
    const mk=(cls,title,child)=>{ const w=document.createElement('label'); w.className='speaker-opt '+cls; const s=document.createElement('span'); s.className='speaker-opt-lbl'; s.textContent=title; w.appendChild(s); w.appendChild(child); opts.appendChild(w); return w; };

    const startInput=document.createElement('input'); startInput.type='number'; startInput.className='speaker-start'; startInput.min='0'; startInput.step='0.1'; startInput.dataset.instId=inst.id;
    startInput.value=(inst.speechStart||0).toFixed(1);
    startInput.addEventListener('input', ()=>{ inst.speechStart=Math.max(0,parseFloat(startInput.value)||0); renderObjectTimeline(); });
    const sw=mk('opt-start',$t('Start (s)','Start (s)'),startInput); sw.title=$t('Startzeit innerhalb der Szene – auch per Balken in der Timeline verschiebbar','Start time within the scene – can also be moved with the bar in the timeline');

    const langSel=document.createElement('select'); langSel.className='speaker-lang'; langSel.dataset.instId=inst.id;
    [['de','Deutsch'],['en','English']].forEach(([v,l])=>{ const o=document.createElement('option'); o.value=v; o.textContent=l; langSel.appendChild(o); });
    langSel.value=instLang(inst);
    langSel.addEventListener('change', ()=>{ setInstLang(inst, langSel.value); });
    mk('opt-lang',$t('Sprache','Language'),langSel).title=$t('Sprache des Sprechtexts (bestimmt Stimmenauswahl und Mundformen)','Language of the spoken text (determines voice choice and mouth shapes)');

    const voice=document.createElement('select'); voice.className='speaker-voice'; voice.dataset.instId=inst.id;
    populateVoiceSelect(voice, inst.voiceName, instLang(inst)); voice.disabled=!!inst.clip;
    voice.addEventListener('change', ()=>{ inst.voiceName=voice.value; renderObjectTimeline(); });
    mk('opt-voice',$t('Stimme','Voice'),voice);

    const rate=document.createElement('input'); rate.type='range'; rate.min='0.6'; rate.max='1.5'; rate.step='0.05'; rate.value=inst.rate||1; rate.className='speaker-rate';
    const rv=document.createElement('span'); rv.className='speaker-val'; rv.textContent=(inst.rate||1).toFixed(2)+'×';
    rate.addEventListener('input',()=>{ inst.rate=parseFloat(rate.value); rv.textContent=inst.rate.toFixed(2)+'×'; });
    rate.addEventListener('change',()=>renderObjectTimeline());
    const rw=mk('opt-rate',$t('Tempo','Speed'),rate); rw.appendChild(rv);

    const pitch=document.createElement('input'); pitch.type='range'; pitch.min='0.6'; pitch.max='1.5'; pitch.step='0.05'; pitch.value=inst.pitch||1; pitch.className='speaker-pitch';
    const pv=document.createElement('span'); pv.className='speaker-val'; pv.textContent=(inst.pitch||1).toFixed(2);
    pitch.addEventListener('input',()=>{ inst.pitch=parseFloat(pitch.value); pv.textContent=inst.pitch.toFixed(2); });

    const bub=document.createElement('input'); bub.type='checkbox'; bub.checked=inst.bubble!==false; bub.className='speaker-bubble';
    bub.addEventListener('change',()=>{ inst.bubble=bub.checked; });
    mk('opt-bubble',$t('Sprechblase','Speech bubble'),bub);

    const clipBox=document.createElement('div'); clipBox.className='speaker-opt opt-clip';
    const fi=document.createElement('input'); fi.type='file'; fi.accept='audio/*'; fi.style.display='none'; fi.className='speaker-clipfile'; fi.dataset.instId=inst.id;
    const cb=document.createElement('button'); cb.type='button'; cb.className='ctrl-btn ctrl-btn-sm speaker-clipbtn';
    cb.textContent=inst.clip?('🎵 '+inst.clip.name):$t('🎵 Audiodatei','🎵 Audio file');
    cb.title=inst.clip?$t('Audiodatei ersetzen (Sprechtext dient als Transkript für Blase und Lippen)','Replace audio file (the speaker text acts as transcript for bubble and lips)'):$t('Eigene Audiodatei statt Computerstimme verwenden (Sprechtext = Transkript für Blase und Lippen)','Use your own audio file instead of a synthetic voice (speaker text = transcript for bubble and lips)');
    cb.addEventListener('click', ()=>fi.click());
    fi.addEventListener('change', async ()=>{
      const f=fi.files&&fi.files[0]; if(!f) return;
      const url=URL.createObjectURL(f); let dur=0;
      try{ dur=await audioDuration(url); }catch(_){ URL.revokeObjectURL(url); alert($t('Diese Audiodatei konnte nicht gelesen werden.','This audio file could not be read.')); return; }
      if(inst.clip) URL.revokeObjectURL(inst.clip.url);
      inst.clip={name:f.name,url,dur}; renderSpeakerTracks(); renderObjectTimeline();
    });
    clipBox.appendChild(fi); clipBox.appendChild(cb);
    if(inst.clip){
      const x=document.createElement('button'); x.type='button'; x.className='ctrl-btn ctrl-btn-sm speaker-clipdel'; x.textContent='✕'; x.title=$t('Audiodatei entfernen','Remove audio file');
      x.addEventListener('click', ()=>{ URL.revokeObjectURL(inst.clip.url); inst.clip=null; renderSpeakerTracks(); renderObjectTimeline(); });
      clipBox.appendChild(x);
    }
    opts.appendChild(clipBox);

    row.appendChild(opts);
    host.appendChild(row);
  });
}

/* ================= Text → Visemen (deutsche Aussprache-Näherung) ================= */
const VIS_VOW={a:'a',e:'e',i:'i',o:'o',u:'u',ä:'e',ö:'o',ü:'u',y:'u'};
const VIS_REDUCE={a:'e',e:'i',i:'i',o:'u',u:'u'};      // Konsonanten halten die Mundform halb offen
const DIGIT_WORDS=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
function wordToVisemesDE(raw){
  let w=raw.toLowerCase().replace(/ß/g,'ss').replace(/[éèêë]/g,'e').replace(/[àáâ]/g,'a').replace(/[óô]/g,'o').replace(/[úû]/g,'u').replace(/ç/g,'s').replace(/ñ/g,'n').replace(/[’'\-]/g,'');
  w=w.replace(/[0-9]/g,d=>DIGIT_WORDS[+d]);
  const V='aeiouäöüy', isV=c=>!!c && V.indexOf(c)>=0;
  const out=[]; let i=0;
  while(i<w.length){
    const c=w[i], d=w.substr(i,2), t=w.substr(i,3);
    if(t==='sch'){ out.push(['u',1]); i+=3; continue; }
    if(d==='ch'){ out.push([null,.8]); i+=2; continue; }
    if(d==='ph'){ out.push(['fv',1]); i+=2; continue; }
    if(d==='pf'){ out.push(['mm',.5]); out.push(['fv',.8]); i+=2; continue; }
    if(d==='qu'){ out.push(['u',.9]); i+=2; continue; }
    if(d==='ei'||d==='ai'||d==='ay'||d==='ey'){ out.push(['a',1.2]); out.push(['i',1.1]); i+=2; continue; }
    if(d==='au'){ out.push(['a',1.2]); out.push(['u',1.1]); i+=2; continue; }
    if(d==='eu'||d==='äu'){ out.push(['o',1.1]); out.push(['i',1.1]); i+=2; continue; }
    if(d==='ie'){ out.push(['i',2]); i+=2; continue; }
    if(isV(c)){
      let long=false;
      if(w[i+1]===c){ long=true; i++; }
      else if(w[i+1]==='h' && !isV(w[i+2])) long=true;
      else if(w[i+1] && !isV(w[i+1]) && isV(w[i+2])) long=true;
      else if(!w[i+1]) long=true;
      out.push([VIS_VOW[c], long?2.2:1.5]); i++; continue;
    }
    if('bpm'.indexOf(c)>=0){ out.push(['mm',.9]); i++; continue; }
    if('fvw'.indexOf(c)>=0){ out.push(['fv',.9]); i++; continue; }
    out.push([null,.65]); i++;
  }
  return finalizeVisemes(out);
}
/* neutrale Konsonanten übernehmen die (verkleinerte) Mundform des Nachbarvokals; gleiche Formen werden zusammengefasst */
function finalizeVisemes(out){
  let last=null;
  out.forEach(o=>{ if(o[0]===null){ if(last) o[0]=VIS_REDUCE[last]||last; } else if(VIS_REDUCE[o[0]]) last=o[0]; else last=null; });
  let next=null;
  for(let k=out.length-1;k>=0;k--){ const o=out[k]; if(o[0]===null){ o[0]=next?(VIS_REDUCE[next]||next):'e'; } else if(VIS_REDUCE[o[0]]) next=o[0]; else next=null; }
  const merged=[];
  out.forEach(o=>{ const m=merged[merged.length-1]; if(m && m[0]===o[0]) m[1]+=o[1]; else merged.push([o[0],o[1]]); });
  return merged;
}
/* ---- Englische Aussprache-Näherung (Buchstabengruppen → Mundform; kein Wörterbuch) ---- */
const DIGIT_WORDS_EN=['zero','one','two','three','four','five','six','seven','eight','nine'];
function wordToVisemesEN(raw){
  let w=raw.toLowerCase().replace(/[’'\-]/g,'').replace(/ß/g,'ss').replace(/[éèêë]/g,'e').replace(/[àáâä]/g,'a').replace(/[óôö]/g,'o').replace(/[úûü]/g,'u').replace(/ç/g,'s').replace(/ñ/g,'n');
  w=w.replace(/[0-9]/g,d=>DIGIT_WORDS_EN[+d]);
  let magic=false;                                     // stummes End-e (make, time, hope) dehnt den Vokal davor
  if(w.length>3 && /[^aeiouy]e$/.test(w) && !/[^aeiouy]le$/.test(w)){ magic=true; w=w.slice(0,-1); }
  const isV=c=>!!c && 'aeiou'.indexOf(c)>=0;
  const out=[]; let i=0;
  if(/^kn|^wr|^gn|^ps/.test(w)) i=1;                   // stummer Anlaut
  while(i<w.length){
    const c=w[i], d=w.substr(i,2), t=w.substr(i,3), atEnd=(i+d.length>=w.length);
    if(t==='igh'){ out.push(['a',1.3]); out.push(['i',1.1]); i+=3; continue; }
    if(t==='tch'){ out.push(['u',.8]); i+=3; continue; }
    if(d==='sh'||d==='ch'){ out.push(['u',.9]); i+=2; continue; }
    if(d==='th'){ out.push([null,.8]); i+=2; continue; }
    if(d==='ph'){ out.push(['fv',1]); i+=2; continue; }
    if(d==='wh'){ out.push(['u',.8]); i+=2; continue; }
    if(d==='qu'){ out.push(['u',.9]); i+=2; continue; }
    if(d==='ck'||d==='ng'){ out.push([null,.7]); i+=2; continue; }
    if(d==='gh'){ i+=2; continue; }
    if(d==='ee'||d==='ea'){ out.push(['i',2]); i+=2; continue; }
    if(d==='oo'){ out.push(['u',2]); i+=2; continue; }
    if(d==='ou'||d==='ow'){ out.push(['a',1.2]); out.push(['u',1.1]); i+=2; continue; }
    if(d==='oi'||d==='oy'){ out.push(['o',1.1]); out.push(['i',1.1]); i+=2; continue; }
    if(d==='ai'||d==='ay'||d==='ei'||d==='ey'){ out.push(['e',1.2]); out.push(['i',1.1]); i+=2; continue; }
    if(d==='oa'){ out.push(['o',2]); i+=2; continue; }
    if(d==='au'||d==='aw'){ out.push(['o',1.8]); i+=2; continue; }
    if(d==='ie'){ out.push(['i',1.8]); i+=2; continue; }
    if(d==='ue'||d==='ew'||d==='eu'){ out.push(['u',1.8]); i+=2; continue; }
    if(d==='ui'){ out.push(['u',1.5]); i+=2; continue; }
    if(d==='ar'){ out.push(['a',1.8]); i+=2; continue; }
    if(d==='or'){ out.push(['o',1.8]); i+=2; continue; }
    if(d==='er'||d==='ir'||d==='ur'){ out.push(['e',1.5]); i+=2; continue; }
    if(c==='y'){ out.push(['i',(i===0)?.8:1.6]); i++; continue; }
    if(isV(c)){
      const long=magic && !isV(w[i+1]) && (i+2>=w.length || !isV(w[i+2]));
      if(c==='u') out.push([long?'u':'a', long?2:1.3]);
      else out.push([c, long?2:1.4]);
      i++; continue;
    }
    if('bpm'.indexOf(c)>=0){ out.push(['mm',.9]); i++; continue; }
    if('fv'.indexOf(c)>=0){ out.push(['fv',.9]); i++; continue; }
    if(c==='w'||c==='j'){ out.push(['u',.8]); i++; continue; }
    out.push([null,.65]); i++;
  }
  if(!out.length) out.push(['e',1]);
  return finalizeVisemes(out);
}
function wordToVisemes(raw,lang){ return lang==='en'?wordToVisemesEN(raw):wordToVisemesDE(raw); }
function buildPlan(text,lang){
  const re=/[0-9A-Za-zÀ-ÿß][0-9A-Za-zÀ-ÿß'’\-]*/g;
  const words=[]; let m;
  while((m=re.exec(text))){ words.push({s:m.index,e:m.index+m[0].length,t:m[0]}); }
  const seq=[]; let u=0;
  words.forEach((w,wi)=>{
    w.u0=u;
    wordToVisemes(w.t,lang).forEach(([v,wt])=>{ seq.push({v,u0:u,u1:u+wt,wi}); u+=wt; });
    w.u1=u;
    const gap=text.slice(w.e, words[wi+1]?words[wi+1].s:text.length);
    const gw=/[.!?\n]/.test(gap)?7:(/[,;:–—]/.test(gap)?4:(wi<words.length-1?.7:.2));
    seq.push({v:'rest',u0:u,u1:u+gw,wi:-1}); u+=gw;
  });
  return {words,seq,total:u};
}
const planCache=new Map();
function getPlan(text,lang){ lang=lang==='en'?'en':'de'; const k=lang+'|'+text; let p=planCache.get(k); if(!p){ p=buildPlan(text,lang); if(planCache.size>300) planCache.clear(); planCache.set(k,p); } return p; }

/* Kalibrierung: wie lange braucht eine Stimme pro „Einheit“? Wird nach jeder echten Wiedergabe verfeinert. */
const DEFAULT_UNIT_MS=61;
let Calib={};
try{ Calib=JSON.parse(localStorage.getItem('sh-calib-v2')||'{}')||{}; }catch(_){ Calib={}; }
function saveCalib(){ try{ localStorage.setItem('sh-calib-v2', JSON.stringify(Calib)); }catch(_){} }
function voiceKey(inst){ const v=Speech.ok?Speech.pickVoice(inst):null; return (v?(v.voiceURI||v.name):'none')+'@'+(inst.rate||1).toFixed(2); }
/* Audio-Quellen ohne Browser-Stimme: eigene Datei oder eigener TTS-Server → Dauer ist bekannt */
function clipInfo(inst){
  if(inst.clip) return inst.clip;
  if(inst.voiceName==='__remote' && Remote.on()){ const d=Remote.dur.get(Remote.key((inst.script||'').trim(),instLang(inst))); if(d) return {dur:d}; }
  return null;
}
function unitMsFor(inst){
  const ci=clipInfo(inst);
  if(ci && ci.dur>0){ const p=getPlan((inst.script||'').trim(),instLang(inst)); if(p.total>0) return ci.dur*1000/(inst.rate||1)/p.total; }
  return Calib[voiceKey(inst)] || (DEFAULT_UNIT_MS/(inst.rate||1));
}
function estimateSpeechDuration(inst){
  const t=(inst.script||'').trim(); if(!t) return 0;
  return Math.max(0.8, getPlan(t,instLang(inst)).total*unitMsFor(inst)/1000+0.25);
}

/* Lippen: aus Plan + Zeit die aktuelle Mundform; Wortgrenzen der Sprach-Engine synchronisieren nach */
const Lip={
  at(job,now){
    const p=job.plan; if(!p.seq.length) return {v:'rest',wi:-1};
    const u=job.anchorU+(now-job.anchorT)/job.unitMs;
    if(u>=p.total){
      if(job.state==='speaking' && !job.silent) return {v:['e','a','mm','o'][Math.floor(now/150)%4], wi:p.words.length-1};
      return {v:'rest',wi:p.words.length-1};
    }
    let lo=0, hi=p.seq.length-1;
    while(lo<hi){ const mid=(lo+hi+1)>>1; if(p.seq[mid].u0<=u) lo=mid; else hi=mid-1; }
    const it=p.seq[lo];
    let wi=it.wi; if(wi<0){ for(let k=lo-1;k>=0;k--){ if(p.seq[k].wi>=0){ wi=p.seq[k].wi; break; } } }
    return {v:it.v, wi};
  },
  boundary(job, charIndex, now){
    const ws=job.plan.words; if(!ws.length) return;
    let wi=ws.findIndex(w=>charIndex>=w.s && charIndex<w.e);
    if(wi<0) wi=ws.findIndex(w=>w.s>=charIndex);
    if(wi<0) return;
    const w=ws[wi];
    if(job.lastB && wi>job.lastB.wi){
      const dU=w.u0-job.lastB.u0, dT=now-job.lastB.t;
      if(dU>0.5 && dT>0){ const a=(job.nMeas||0)===0?0.85:0.5; job.nMeas=(job.nMeas||0)+1; job.unitMs=Math.max(job.baseUnit*0.3, Math.min(job.baseUnit*3, job.unitMs*(1-a)+(dT/dU)*a)); }
    }
    job.lastB={wi,u0:w.u0,t:now}; job.anchorU=w.u0; job.anchorT=now; job.hadBoundary=true;
  }
};

/* ================= Sprachausgabe: eine Stimme zur Zeit, Warteschlange ================= */
function anRms(an){ const b=new Float32Array(an.fftSize); an.getFloatTimeDomainData(b); let q=0; for(let i=0;i<b.length;i++) q+=b[i]*b[i]; return Math.sqrt(q/b.length); }
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const Speech={
  ok:('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined'),
  voices:[], current:null, queue:[], lastEnd:0, keepAlive:null, calibDirty:false,
  loadVoices(){ if(!this.ok) return; try{ this.voices=speechSynthesis.getVoices()||[]; }catch(_){ this.voices=[]; } },
  unlock(){ if(this.ok&&IS_IOS){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(_){} } },
  busy(){ return !!this.current || this.queue.length>0; },
  pickVoice(inst){
    if(inst.voiceName && inst.voiceName!=='__remote'){ const v=this.voices.find(v=>v.name===inst.voiceName); if(v) return v; }
    const lang=instLang(inst);
    const de=groupedVoices(lang).main; if(!de.length) return null;
    const def=characters.find(c=>c.id===inst.charId)||{};
    const FEM=lang==='en'
      ? /aria|jenny|sonia|libby|michelle|ana\b|zira|hazel|susan|samantha|karen|moira|tessa|fiona|serena|victoria|allison|kate|catherine|female|emma|amy|joanna|salli|kimberly|ivy|nicole|olivia/i
      : /katja|marlene|vicki|anna|petra|amala|seraphina|hedda|helena|elke|claudia|female|weiblich|sabine|marie|monika|steffi|vera|lea\b/i;
    const MALE=lang==='en'
      ? /guy|ryan|davis|christopher|eric|roger|steffan|george|mark|david|james|richard|alex|daniel|fred|tom\b|oliver|arthur|rishi|aaron|\bmale\b|brian|matthew|joey|justin|russell|nicolas/i
      : /conrad|killian|stefan|markus|hans|jonas|florian|daniel|martin|\bmale\b|männlich|yannick|jörg|thomas|klaus|reed|bernd|dieter/i;
    const pref=de.filter(v=>def.female?FEM.test(v.name):MALE.test(v.name));
    const pool=pref.length?pref:de;

  },
  makeJob(inst){
    const text=(inst.script||'').trim();

  _next(){ if(this.current||!this.queue.length) return; this._start(this.queue.shift()); },
  _begin(job){

  _silentStart(job){ this._abortAudio(job); job.silent=true; clearTimeout(job.endTimer); this._begin(job); },
  _start(job){

    if(inst.voiceName==='__remote' && Remote.on()){ job.kind='remote'; this._startAudio(job, ()=>Remote.get(job.text,lang)); return; }
    if(!this.ok){ this._silentStart(job); return; }
    const u=new SpeechSynthesisUtterance(job.text);
    const v=this.pickVoice(job.inst); u.lang=v?v.lang:(lang==='en'?'en-US':'de-DE'); if(v) u.voice=v;

      if(err==='canceled'||err==='interrupted') return this._finish(job,false);

  /* Audio-Quelle (eigene Datei oder TTS-Server): echte Dauer bekannt, Lippen laufen nach Text-Plan, Lautstärke blendet Pausen aus */
  _abortAudio(job){ if(job.el){ const e=job.el; e.onerror=e.onended=e.onplaying=null; try{ e.pause(); e.removeAttribute('src'); e.load(); }catch(_){} job.el=null; } job.an=null; },
  _startAudio(job,getSrc){
    job.startTimer=setTimeout(()=>{ if(job.state==='starting'&&this.current===job){ this._abortAudio(job); this._silentStart(job); } }, 20000);
    Promise.resolve().then(getSrc).then(src=>{

      job.audioMs=dur>0?dur*1000/(job.rate||1):0;
      try{ if(Music.ensure() && Music.ctx.state==='running'){ const sn=Music.ctx.createMediaElementSource(a), an=Music.ctx.createAnalyser(); an.fftSize=512; sn.connect(an); an.connect(Music.ctx.destination); job.an=an; } }catch(_){ job.an=null; }

  _keepAlive(){
    if(this.keepAlive) return;

      if(!this.current){ clearInterval(this.keepAlive); this.keepAlive=null; return; }
      try{ if(speechSynthesis.speaking && !speechSynthesis.paused){ speechSynthesis.pause(); speechSynthesis.resume(); } }catch(_){}
    }, 9000);
  },
  _finish(job,silent){
    if(job.state==='done') return;
    const was=job.state; job.state='done';
    clearTimeout(job.startTimer); clearTimeout(job.endTimer); this._abortAudio(job);
    const now=performance.now();
    if(!silent && !job.silent && was==='speaking' && this.ok && job.audio){
      const el=now-job.t0;
      if(el>500 && job.plan.total>3){
        const unit=el/job.plan.total, k=voiceKey(job.inst);
        Calib[k]=Calib[k]?Calib[k]*0.5+unit*0.5:unit; saveCalib(); this.calibDirty=true;
      }
    }
    if(this.current===job) this.current=null;
    this.lastEnd=now;
    Player.onSpeechEnd(job);
    setTimeout(()=>this._next(), 90);
  },
  stopAll(){
    this.queue.forEach(j=>{ j.state='done'; });
    this.queue=[];
    const c=this.current; this.current=null;
    if(c){ c.state='done'; clearTimeout(c.startTimer); clearTimeout(c.endTimer); this._abortAudio(c); }
    if(this.ok){ try{ speechSynthesis.cancel(); }catch(_){} }
  }
};

/* ================= Hintergrundmusik (WebAudio, kein Download) ================= */
const mf=m=>440*Math.pow(2,(m-69)/12);
const MUSIC={
  soft:{bpm:76, step(M,i,t,s){
    const bar=Math.floor(i/16)%4, pos=i%16, ch=[[57,60,64],[53,57,60],[48,55,60],[55,59,62]][bar];
    if(pos===0) ch.forEach(n=>M.tone(mf(n-12),t,s*15.5,'triangle',0.2,900,0.5));
    if(pos%4===2){ const a=[ch[0]+12,ch[1]+12,ch[2]+12,ch[1]+12]; M.tone(mf(a[(pos>>2)%4]),t,s*3,'sine',0.17,2600,0.01); }
  }},
  energetic:{bpm:118, step(M,i,t,s){
    const bar=Math.floor(i/16)%4, pos=i%16, root=[45,41,48,43][bar];
    if(pos%4===0) M.kick(t,0.9);
    if(pos%2===0) M.noise(t,0.05,0.1,7000);
    if(pos%4===2) M.tone(mf(root),t,s*1.8,'sawtooth',0.16,700,0.005);
    if(pos===4||pos===12) [root+12,root+16,root+19].forEach(n=>M.tone(mf(n),t,s*1.4,'square',0.05,1800,0.005));
  }},
  corporate:{bpm:100, step(M,i,t,s){
    const bar=Math.floor(i/16)%4, pos=i%16, ch=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]][bar];
    if(pos===0) ch.forEach(n=>M.tone(mf(n-12),t,s*15,'triangle',0.13,1100,0.3));
    if(pos%2===0) M.tone(mf(ch[(pos>>1)%3]+12),t,s*2.2,'triangle',0.15,3200,0.005);
    if(pos%4===0) M.noise(t,0.03,0.05,9000);
  }},
  tension:{bpm:64, step(M,i,t,s){
    const pos=i%16;
    if(pos===0) M.tone(mf(33),t,s*16,'sawtooth',0.2,260,0.8);
    if(pos===0||pos===3) M.kick(t,0.55);
    if(i%32===20) M.tone(mf(81),t,s*6,'sine',0.07,4000,0.02);
    if(i%32===8) M.tone(mf(80),t,s*6,'sine',0.05,4000,0.02);
  }}
};
const Music={
  ctx:null, master:null, an:null, name:'none', timer:null, step:0, nextT:0, duckOn:false, noiseBuf:null, previewTimer:null,
  fileEl:null, fileNode:null, opts:{vol:40,loop:true,duck:true},
  ensure(){
    if(this.ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    try{ this.ctx=new AC(); }catch(_){ return false; }
    this.master=this.ctx.createGain(); this.master.gain.value=0;
    this.an=this.ctx.createAnalyser(); this.an.fftSize=512;
    this.master.connect(this.an); this.an.connect(this.ctx.destination);
    return true;
  },
  unlock(){ if(this.ensure() && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
  level(){ const o=this.opts, base=this.fileEl?(o.vol/100):0.14*(o.vol/40); return (this.duckOn&&o.duck)?base*0.28:base; },
  setOpts(sc){ this.opts={vol:(sc&&sc.musicVol!=null)?sc.musicVol:40, loop:!sc||sc.musicLoop!==false, duck:!sc||sc.musicDuck!==false}; if(this.fileEl) this.fileEl.loop=this.opts.loop; if(this.timer||this.fileEl) this._fade(this.level()); },
  _playFile(name){
    const it=musicLib.find(m=>'lib:'+m.id===name);
    if(!it||!this.ensure()){ this.name='none'; this._fade(0); return; }
    this.unlock();
    const a=new Audio(); a.preload='auto'; a.loop=this.opts.loop; a.src=it.url;
    try{ const src=this.ctx.createMediaElementSource(a); src.connect(this.master); this.fileNode=src; }catch(_){}
    this.fileEl=a; this._fade(this.level());
    const pr=a.play(); if(pr&&pr.catch) pr.catch(()=>{});
  },
  _stopFile(){ if(this.fileEl){ const a=this.fileEl, n=this.fileNode; this.fileEl=null; this.fileNode=null; setTimeout(()=>{ try{ a.pause(); }catch(_){} try{ n&&n.disconnect(); }catch(_){} },480); } },
  play(name){
    name=name||'none';
    if(name===this.name && (this.timer||this.fileEl)){ this._fade(this.level()); return; }
    this.halt(); this._stopFile(); this.name=name;
    if(name.indexOf('lib:')===0){ this._playFile(name); return; }
    if(name==='none'||!MUSIC[name]||!this.ensure()){ this.name='none'; this._fade(0); return; }
    this.unlock();
    this.step=0; this.nextT=this.ctx.currentTime+0.06;
    this._fade(this.level());
    this.timer=setInterval(()=>this.pump(),40);
  },
  pump(){
    const P=MUSIC[this.name]; if(!P||!this.ctx) return;
    const spb=60/P.bpm/4;
    let guard=0;
    while(this.nextT<this.ctx.currentTime+0.3 && guard++<64){ P.step(this,this.step,this.nextT,spb); this.step++; this.nextT+=spb; }
  },
  halt(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  stop(){ this.halt(); this._stopFile(); clearTimeout(this.previewTimer); this.name='none'; this._fade(0); },
  preview(name){ if(Player.running) return; this.play(name); clearTimeout(this.previewTimer); this.previewTimer=setTimeout(()=>{ if(!Player.running) this.stop(); },name&&name.indexOf('lib:')===0?7000:3500); },
  duck(on){ this.duckOn=on; if(this.timer||this.fileEl) this._fade(this.level()); },
  _fade(v){ if(!this.master) return; const t=this.ctx.currentTime; this.master.gain.cancelScheduledValues(t); this.master.gain.setTargetAtTime(v,t,0.18); },
  rms(){ if(!this.an) return 0; const b=new Float32Array(this.an.fftSize); this.an.getFloatTimeDomainData(b); let s=0; for(let i=0;i<b.length;i++) s+=b[i]*b[i]; return Math.sqrt(s/b.length); },
  tone(f,t,d,type,g,lp,att){
    const c=this.ctx,o=c.createOscillator(),e=c.createGain(),F=c.createBiquadFilter(); att=att||0.01;
    o.type=type; o.frequency.value=f; F.type='lowpass'; F.frequency.value=lp||3000;
    e.gain.setValueAtTime(0.0001,t); e.gain.linearRampToValueAtTime(g,t+att);
    e.gain.setTargetAtTime(0.0001,t+Math.max(att,d*0.6),Math.max(0.03,d*0.22));
    o.connect(F); F.connect(e); e.connect(this.master); o.start(t); o.stop(t+d+0.5);
  },
  kick(t,g){
    const c=this.ctx,o=c.createOscillator(),e=c.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12);
    e.gain.setValueAtTime(g,t); e.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(e); e.connect(this.master); o.start(t); o.stop(t+0.35);
  },
  noise(t,d,g,hp){
    const c=this.ctx;
    if(!this.noiseBuf){ const n=c.sampleRate; this.noiseBuf=c.createBuffer(1,n,c.sampleRate); const ch=this.noiseBuf.getChannelData(0); for(let i=0;i<n;i++) ch[i]=Math.random()*2-1; }
    const s=c.createBufferSource(), F=c.createBiquadFilter(), e=c.createGain();
    s.buffer=this.noiseBuf; F.type='highpass'; F.frequency.value=hp;
    e.gain.setValueAtTime(g,t); e.gain.exponentialRampToValueAtTime(0.001,t+d);
    s.connect(F); F.connect(e); e.connect(this.master); s.start(t); s.stop(t+d+0.05);
  }
};

const Bubble={
  items:{},
  layer(){ return document.getElementById('stageBubbles'); },
  show(inst,job){
    this.hide(inst,true);
    const b=document.createElement('div'); b.className='bubble'; b.dataset.instId=inst.id;
    const text=job.text; let p=0;
    job.plan.words.forEach(w=>{
      if(w.s>p) b.appendChild(document.createTextNode(text.slice(p,w.s)));
      const sp=document.createElement('span'); sp.className='w'; sp.textContent=text.slice(w.s,w.e); b.appendChild(sp); p=w.e;
    });
    if(p<text.length) b.appendChild(document.createTextNode(text.slice(p)));
    this.layer().appendChild(b);
    this.items[inst.id]={el:b, spans:Array.prototype.slice.call(b.querySelectorAll('.w')), cur:-2};
    this.place(inst);
    requestAnimationFrame(()=>b.classList.add('on'));
  },
  update(inst,wi){
    const it=this.items[inst.id]; if(!it) return;
    if(wi!==it.cur){ it.spans.forEach((s,i)=>{ s.classList.toggle('done',i<wi); s.classList.toggle('cur',i===wi); }); it.cur=wi; }
    this.place(inst);
  },
  finish(inst){ const it=this.items[inst.id]; if(it){ it.spans.forEach(s=>{ s.classList.add('done'); s.classList.remove('cur'); }); } },
  place(inst){
    const it=this.items[inst.id], el=charEl(inst.id); if(!it||!el) return;
    const st=document.getElementById('stage').getBoundingClientRect(), r=el.getBoundingClientRect(), b=it.el, K=STAGE_K;
    const bw=b.offsetWidth, bh=b.offsetHeight;
    const cx=(r.left-st.left+r.width/2)/K;
    const left=Math.max(6,Math.min(STAGE_W-bw-6, cx-bw/2));
    let top=(r.top-st.top)/K+(r.height/K)*0.04-bh-12; if(top<6) top=6;
    b.style.left=left+'px'; b.style.top=top+'px';
    b.style.setProperty('--tail', Math.max(18,Math.min(bw-18,cx-left))+'px');
  },
  hide(inst,instant){
    const it=this.items[inst.id]; if(!it) return; delete this.items[inst.id];
    if(instant){ it.el.remove(); return; }
    it.el.classList.remove('on'); setTimeout(()=>it.el.remove(),260);
  },
  clear(){ const l=this.layer(); if(l) l.innerHTML=''; this.items={}; }
};

/* ================= Wiedergabe: ein einziger Ablauf für Einzelzeile, Szene und Gesamtfilm ================= */
function findInst(id){ return getCurrentScene().characters.find(c=>c.id===id); }
const REACTION_CLASSES=['reaction-joy','reaction-anger','reaction-surprise','reaction-news','reaction-listening'];
const OBJ_EFFECT_CLASSES=['obj-effect-fade-in','obj-effect-rise-up','obj-effect-slide-in-left','obj-effect-zoom-in','obj-effect-pop'];
function fmt(sec){ const m=Math.floor(sec/60); const s=(sec%60).toFixed(1).padStart(4,'0'); return String(m).padStart(2,'0')+':'+s; }
function pulseChar(inst){ const el=charEl(inst.id); if(!el) return; el.classList.remove('reaction-pulse'); void el.offsetWidth; el.classList.add('reaction-pulse'); }

function revealObject(objId, effect){
  const el=objEl(objId); if(!el) return;
  el.style.transition=''; el.style.opacity='';
  el.classList.remove(...OBJ_EFFECT_CLASSES); void el.offsetWidth;
  if(effect && effect!=='none' && OBJ_EFFECT_CLASSES.indexOf('obj-effect-'+effect)>=0) el.classList.add('obj-effect-'+effect);
}
function hideObject(objId){ const el=objEl(objId); if(el){ el.classList.remove(...OBJ_EFFECT_CLASSES); el.style.transition='opacity .3s'; el.style.opacity='0'; } }
function hideObjectsForPlayback(scene){
  scene.objects.forEach(o=>{ const el=objEl(o.id); if(el){ el.style.transition=''; el.style.opacity='0'; el.classList.remove(...OBJ_EFFECT_CLASSES); } });
}
function freezeMove(el){ if(el.style.transition){ el.style.left=getComputedStyle(el).left; el.style.transition=''; void el.offsetWidth; } }
function setPose(inst,pose,dur){
  const s=rigState(inst); s.pose=pose; applyRig(inst);
  const el=charEl(inst.id); if(!el) return;
  freezeMove(el);
  if(pose==='walk' && inst.walkMove!==false && dur>0){
    const f=inst.facing||'front';
    if(f==='side'||f==='threeq'){
      const dir=inst.flipped?-1:1;
      const stW=STAGE_W;
      const cur=el.offsetLeft, speed=inst.w*0.9;
      const target=Math.max(-inst.w*0.1, Math.min(stW-inst.w*0.9, cur+dir*speed*dur));
      el.style.transition='left '+dur+'s cubic-bezier(.32,.04,.4,1)'; el.style.left=target+'px';
    }
  }
}

function buildSceneEvents(scene){
  const ev=[], D=scene.duration;
  scene.objects.forEach(o=>{
    const s=o.timelineStart||0;
    ev.push({t:s,pri:1,type:'obj-show',id:o.id,effect:o.effect});
    if(o.timelineDuration!=null && s+o.timelineDuration<D) ev.push({t:s+o.timelineDuration,pri:0,type:'obj-hide',id:o.id});
  });
  scene.characters.forEach(c=>{
    (c.clips||[]).forEach(cl=>{
      ev.push({t:cl.start,pri:1,type:'pose',id:c.id,pose:cl.pose,dur:cl.dur});
      ev.push({t:cl.start+cl.dur,pri:0,type:'pose',id:c.id,pose:c.action||'idle',dur:0,revert:true});
    });
    const hasText=!!(c.script||'').trim();
    if(c.reaction && c.reaction!=='none' && !(c.reactionAuto!==false && hasText)){
      ev.push({t:c.reactionStart||0,pri:1,type:'mood',id:c.id,mood:c.reaction});
      ev.push({t:(c.reactionStart||0)+(c.reactionDur||2.5),pri:0,type:'mood',id:c.id,mood:'none'});
    }
    if(hasText) ev.push({t:c.speechStart||0,pri:2,type:'speak',id:c.id});
  });
  ev.sort((a,b)=>a.t-b.t||a.pri-b.pri);
  return ev;
}

const Player={

    Speech.unlock(); Music.unlock();
    this.running=true; this.kind='line'; rt={}; this.lineInst=inst;
    document.body.classList.add('playing'); selectedEntity=null;
    renderCharacters();
    this.scene=getCurrentScene();
    this.lineDur=estimateSpeechDuration(inst);
    this.events=[{t:0,pri:2,type:'speak',id:inst.id}]; this.ei=0; this.sceneT0=performance.now();
    this.timer=setInterval(()=>this.tick(),20);
  },
  enter(pos,transition){
    const idx=this.order[pos]; this.pos=pos;
    showScene(idx, transition);
    const scene=scenesTimeline[idx]; this.scene=scene;
    rt={}; scene.characters.forEach(c=>{ rt[c.id]={pose:c.action||'idle',mood:'none',talking:false,v:null}; applyRig(c); });
    hideObjectsForPlayback(scene);
    this.events=buildSceneEvents(scene); this.ei=0;
    this.sceneT0=performance.now();
    Music.setOpts(scene); Music.play(scene.bgMusic||'none');
    scene.characters.forEach(c=>{ if(c.voiceName==='__remote' && !c.clip && Remote.on() && (c.script||'').trim()) Remote.get(c.script.trim(),instLang(c)).catch(()=>{}); });
  },
  exec(ev,t){
    const inst=ev.id&&(ev.type==='pose'||ev.type==='mood'||ev.type==='speak')?findInst(ev.id):null;
    switch(ev.type){
      case 'obj-show': revealObject(ev.id,ev.effect); break;
      case 'obj-hide': hideObject(ev.id); break;
      case 'pose':
        if(!inst) break;
        if(ev.revert && (inst.clips||[]).some(c=>t>=c.start-0.001 && t<c.start+c.dur-0.001)) break;
        setPose(inst,ev.pose,ev.dur); break;
      case 'mood': if(inst){ const s=rigState(inst); s.mood=ev.mood; applyRig(inst); if(ev.mood!=='none') pulseChar(inst); } break;
      case 'speak': if(inst) Speech.enqueue(Speech.makeJob(inst)); break;
    }
  },
  tick(){
    if(!this.running) return;
    const now=performance.now(), t=(now-this.sceneT0)/1000;
    while(this.ei<this.events.length && this.events[this.ei].t<=t){ this.exec(this.events[this.ei++], t); }
    const j=Speech.current;
    if(j && j.state==='speaking'){ const it=Lip.at(j,now); let v=it.v; if(j.an && v!=='rest' && anRms(j.an)<0.012) v='rest'; setViseme(j.inst,v); Bubble.update(j.inst,it.wi); }
    const tc=document.getElementById('timeCode'), ph=document.getElementById('playhead');
    if(this.kind==='line'){
      const d=Math.max(this.lineDur,0.5);
      ph.style.left=Math.min(100,t/d*100)+'%'; tc.textContent=fmt(t)+' / '+fmt(d);
      if(this.ei>=this.events.length && !Speech.busy() && t>0.15) this.finish(true);
      return;
    }
    const D=this.scene.duration, pct=Math.min(1,t/D);
    updateCursors(pct*100);
    ph.style.left=(pct*100)+'%'; tc.textContent=fmt(Math.min(t,D))+' / '+fmt(D);
    const el=this.nominalBefore+Math.min(t,D);
    document.getElementById('masterPlayhead').style.left=Math.min(100,el/this.totalNominal*100)+'%';
    document.getElementById('masterTimeCode').textContent=fmt(el)+' / '+fmt(this.totalNominal);
    if(t>=D && this.ei>=this.events.length && !Speech.busy() && now-Speech.lastEnd>350) this.next();
  },
  next(){
    if(this.pos+1<this.order.length){
      const prev=scenesTimeline[this.order[this.pos]];
      this.nominalBefore+=prev.duration;
      this.enter(this.pos+1, prev.transitionOut||'fade');
    } else this.finish(true);
  },
  onSpeechStart(job){
    const inst=job.inst; if(!inst) return;
    const s=rigState(inst); s.talking=true;
    job.coupled=(inst.reactionAuto!==false && inst.reaction && inst.reaction!=='none');
    if(job.coupled){ s.mood=inst.reaction; pulseChar(inst); }
    applyRig(inst);
    if(inst.bubble!==false) Bubble.show(inst,job);
    Music.duck(true);
  },
  onSpeechEnd(job){
    const inst=job.inst; if(!inst) return;
    const s=rigState(inst); s.talking=false; s.v=null; applyRig(inst);
    Bubble.finish(inst); setTimeout(()=>Bubble.hide(inst),350);
    if(job.coupled){ setTimeout(()=>{ if(Player.running){ const st=rigState(inst); if(!st.talking){ st.mood='none'; applyRig(inst); } } },500); }
    if(!Speech.queue.length) Music.duck(false);
  },
  finish(restore){
    if(!this.running) return;
    clearInterval(this.timer); this.timer=null; this.running=false;
    Speech.stopAll(); Music.stop(); Bubble.clear();
    document.body.classList.remove('playing'); rt={}; clearCursors();
    document.getElementById('playhead').style.left='0%'; document.getElementById('timeCode').textContent='00:00.0 / 00:00.0';
    if(restore!==false){
      if(this.kind==='all' && currentSceneIndex!==this.origIdx) selectScene(this.origIdx);
      else { renderCharacters(); renderObjects(); }
      resetMasterUI();
      if(Speech.calibDirty){ Speech.calibDirty=false; renderObjectTimeline(); }
    }
  },
  stop(restore){ if(this.running) this.finish(restore!==false); }
};

/* ================= Gesamte Animation: Timeline über alle Szenen ================= */
function totalNominal(){ return scenesTimeline.reduce((s,sc)=>s+sc.duration,0)||1; }
function resetMasterUI(){
  const ph=document.getElementById('masterPlayhead'); if(ph) ph.style.left='0%';
  const tc=document.getElementById('masterTimeCode'); if(tc) tc.textContent=fmt(0)+' / '+fmt(totalNominal());
}
function renderMasterTimeline(){
  const host=document.getElementById('masterRuler'); host.innerHTML='';
  const total=totalNominal();
  scenesTimeline.forEach((scene,idx)=>{
    const seg=document.createElement('div'); seg.className='master-scene-seg';
    seg.style.width=((scene.duration/total)*100)+'%';
    seg.style.background = idx===currentSceneIndex ? 'var(--accent-violet)' : 'var(--panel-border)';
    seg.style.color = idx===currentSceneIndex ? '#fff' : 'var(--text-secondary)';
    seg.textContent=(idx+1)+'. '+$d(scene.label);
    seg.title=$d(scene.label)+' ('+scene.duration+'s)';
    seg.addEventListener('click', ()=>selectScene(idx));
    host.appendChild(seg);
  });
  if(!Player.running) resetMasterUI();
}

/* Szene anzeigen (Bearbeiten & Wiedergabe) */
function showScene(idx, transitionType){
  currentSceneIndex=idx; selectedEntity=null;
  renderStageBackground(); renderCharacters(); renderObjects();
  if(!Player.running) renderPanel();
  renderSceneTrack(); renderSpeakerTracks(); renderObjectTimeline();
  const stageEl=document.getElementById('stage');
  stageEl.classList.remove('transition-fade','transition-slide-left','transition-slide-up','transition-wipe','transition-zoom');
  void stageEl.offsetWidth;
  if(transitionType && transitionType!=='cut') stageEl.classList.add('transition-'+transitionType);
}

});

/* ================= Sprachumschalter (Oberfläche) & Stimmquellen-Dialog ================= */
const DEMO={
  de:['Guten Tag und herzlich willkommen in unserer Filiale. Was kann ich für Sie tun?','Danke! Ich möchte gern ein neues Konto eröffnen.'],
  en:['Good morning, and welcome to our branch. How can I help you today?',"Thank you! I'd like to open a new account."]
};
function refreshAll(){ renderPanel(); renderSceneTrack(); renderSpeakerTracks(); renderObjectTimeline(); renderMasterTimeline(); renderObjects(); renderCharacters(); updateVoiceDlgText(); }
function setLang(l){
  if(l!=='de'&&l!=='en'||l===LANG) return;
  Player.stop(false);
  const old=LANG; LANG=l;
  try{ localStorage.setItem('sh-lang',l); }catch(_){}
  // unveränderten Demo-Dialog mit umschalten
  scenesTimeline.forEach(sc=>{
    const cs=sc.characters.filter(c=>c.demoIdx!==undefined);
    cs.forEach(c=>{ if(c.script===DEMO[old][c.demoIdx]){ c.script=DEMO[l][c.demoIdx]; c.lang=l; if(c.voiceName&&c.voiceName!=='__remote') c.voiceName=''; } });
    const a=cs.find(c=>c.demoIdx===0), b=cs.find(c=>c.demoIdx===1);
    if(a&&b&&b.script===DEMO[l][1]) b.speechStart=Math.round((a.speechStart+estimateSpeechDuration(a)+0.5)*10)/10;
  });
  applyStatic(); refreshAll();
}
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
function updateVoiceDlgText(){
  const el=document.getElementById('voiceDlgInfo'); if(!el) return;
  el.textContent=$t('Standardmäßig nutzt das Tool die Stimmen deines Browsers/Betriebssystems (je Figur Deutsch oder Englisch). Für bessere Stimmen: pro Figur eine eigene Audiodatei hochladen (Button „Audiodatei“ in der Sprecherspur) oder hier einen eigenen TTS-Server eintragen, z. B. einen lokalen Piper-Server (siehe docs/VOICES.md). Der Server erhält per POST {"text","lang","voice"} und liefert Audio (WAV/MP3) zurück; steht {text} in der URL, wird stattdessen per GET abgefragt.',
    'By default the tool uses your browser/OS voices (German or English per figure). For better voices: upload your own audio file per figure (“Audio file” button in the speaker track) or enter your own TTS server here, e.g. a local Piper server (see docs/VOICES.md). The server receives {"text","lang","voice"} via POST and returns audio (WAV/MP3); if the URL contains {text}, it is queried via GET instead.');
}
(function initVoiceDlg(){
  const dlg=document.getElementById('voiceDlg'), url=document.getElementById('remoteUrl'), vo=document.getElementById('remoteVoice'), st=document.getElementById('remoteStatus');
  const open=()=>{ url.value=Remote.url; vo.value=Remote.voice; st.textContent=''; st.className=''; updateVoiceDlgText(); dlg.hidden=false; url.focus(); };
  const close=()=>{ Remote.url=url.value.trim(); Remote.voice=vo.value.trim(); Remote.save(); Remote.cache.clear(); Remote.dur.clear(); dlg.hidden=true; refreshVoiceSelects(); renderObjectTimeline(); };
  document.getElementById('voicesBtn').addEventListener('click',open);
  document.getElementById('voiceDlgClose').addEventListener('click',close);
  dlg.addEventListener('click',e=>{ if(e.target===dlg) close(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!dlg.hidden) close(); });
  document.getElementById('remoteTest').addEventListener('click',async()=>{
    const keep=[Remote.url,Remote.voice]; Remote.url=url.value.trim(); Remote.voice=vo.value.trim();
    st.className=''; st.textContent=$t('Teste …','Testing …');
    try{
      if(!Remote.url) throw new Error($t('Keine URL eingetragen','No URL entered'));
      const sample=LANG==='en'?'Hello, this is a test.':'Hallo, das ist ein Test.';
      const r=await Remote.get(sample, LANG);
      st.className='ok'; st.textContent=$t('Verbindung ok – ','Connection ok – ')+(r.dur?r.dur.toFixed(1)+' s':$t('Audio erhalten','audio received'));
      const a=new Audio(r.url); a.play().catch(()=>{});
    }catch(e){ st.className='err'; st.textContent=$t('Fehler: ','Error: ')+(e&&e.message||e)+$t(' – läuft der Server, und erlaubt er CORS?',' – is the server running and does it allow CORS?'); }
    finally{ Remote.cache.clear(); Remote.dur.clear(); Remote.url=keep[0]; Remote.voice=keep[1]; }   /* Eingaben werden erst mit „Schließen“ übernommen */
  });
})();
